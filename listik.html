<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Листик — репетитор по математике</title>
<style>
@font-face { font-family: "Manrope"; src: url("fonts/Manrope-cyrillic-ext.woff2") format("woff2"); font-weight: 200 800; font-display: swap; unicode-range: U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F; }
@font-face { font-family: "Manrope"; src: url("fonts/Manrope-cyrillic.woff2") format("woff2"); font-weight: 200 800; font-display: swap; unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
@font-face { font-family: "Manrope"; src: url("fonts/Manrope-latin.woff2") format("woff2"); font-weight: 200 800; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
@font-face { font-family: "Onest"; src: url("fonts/Onest.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Caveat"; src: url("fonts/Caveat.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
  :root {
    --paper: #FBFAF4;
    --grid: rgba(27,36,64,.055);
    --ink: #1E2A22;
    --pen: #2B4BC4;
    --red: #C2620A;
    --green: #1F7A45;
    --green-d: #17653A;
    --tint: #E5F3E9;
    --sun: #F2C14E;
    --text: #1E2A22;
    --muted: #4B5575;
    --card: #FFFFFF;
    --line: #DDE3D6;
    --ok-bg: #E5F3E9;
    --bad-bg: #FFF0DB;
    --mark-bg: #E5F3E9;
    --btn-text: #FFFFFF;
    --head:"Nunito",system-ui,sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: -1px -1px;
    color: var(--text);
    font-family:"Nunito",system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    min-height: 100vh;
  }
  body::before {
    content: ""; position: fixed; top: 0; bottom: 0; left: 14px; width: 2px;
    background: var(--red); opacity: .55; pointer-events: none;
  }
  .sheet { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px 32px; }
  @media (min-width: 700px) {
    body::before { left: calc(50% - 320px + 14px); }
    .sheet { padding-left: 34px; }
  }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 32px; color: var(--ink); line-height: 1; }
  .brand svg { width: 34px; height: 34px; }
  .back {
    font: inherit; font-size: 16px; font-weight: 700; background: none; border: 0; color: var(--ink);
    padding: 10px 6px; min-height: 44px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }
  h1, h2 { margin: 0; line-height: 1.2; }
  .lead { font-size: 20px; margin: 0 0 22px; max-width: 34ch; }

  /* каталог задач: сотни номеров на одной странице */
  .cat-title { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
  .cat-title .lf { width: 40px; height: 40px; flex: none; }
  .cat-title h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; }
  .cat-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; }
  .cat-search { flex: 1 1 240px; min-width: 0; }
  .cat-search input { width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 16px; font: inherit; font-size: 17px; color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 14px; }
  .cat-search input:focus { outline: none; border-color: var(--green); }
  .seg { display: inline-flex; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; }
  .seg button { font: inherit; font-size: 15px; font-weight: 700; min-height: 42px; padding: 0 14px; border: 0; background: none; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--green); color: #fff; }
  .cat-meta { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 10px; }
  .cat-meta a { color: var(--green); }
  .grp { border: 2px solid var(--line); border-radius: 18px; background: #fff; margin: 0 0 10px; overflow: hidden; }
  .grp-h { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px; padding: 8px 16px; font: inherit; font-size: 17px; font-weight: 800; color: var(--ink); background: none; border: 0; cursor: pointer; text-align: left; }
  .grp-h .gt { flex: 1 1 auto; min-width: 0; }
  .grp-h .gc { flex: none; font-size: 14px; font-weight: 700; color: var(--muted); }
  .grp-h .gc b { color: var(--green); }
  .grp-h .chev { flex: none; transition: transform .18s ease; }
  .grp-h[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .grp-b { padding: 4px 14px 16px; }
  .grp2 { margin: 0 0 26px; }
  .grp2-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 10px; font-size: 20px; font-weight: 800; line-height: 1.3; color: var(--ink); }
  .grp2-h .gc { flex: none; font-size: 14px; font-weight: 700; color: var(--muted); }
  .grp2-h .gc b { color: var(--green); }
  .grp2-empty { margin: 0; padding: 6px 2px; font-size: 16px; color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 8px; list-style: none; margin: 0; padding: 0; }
  .tile { position: relative; width: 100%; min-height: 54px; padding: 0 4px; font: inherit; font-size: 20px; font-weight: 800; color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; }
  .tile:hover { border-color: var(--green); }
  .tile.done { background: var(--tint); color: var(--green); border-color: #BFE3C8; }
  .tile.progress { border-color: var(--sun); box-shadow: inset 0 0 0 2px var(--sun); }
  .tile.lock { color: var(--muted); background: #F6F4EA; }
  .tile .mk { position: absolute; top: 2px; right: 5px; font-size: 11px; line-height: 1; }
  .rows { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .rows li, .tiles li { min-width: 0; }
  .row-btn { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 6px 12px; font: inherit; color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 14px; cursor: pointer; text-align: left; }
  .row-btn:hover { border-color: var(--green); }
  .row-btn .rno { flex: none; min-width: 44px; text-align: center; padding: 4px 8px; font-size: 17px; font-weight: 800; color: var(--green); background: var(--tint); border-radius: 10px; }
  .row-btn.word .rno { background: #FFF1C2; color: var(--ink); }
  .row-btn .rtx { flex: 1 1 auto; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .row-btn .rtx b { color: var(--ink); font-weight: 700; margin-right: 6px; }
  .row-btn .rst { flex: none; font-size: 15px; color: var(--green); font-weight: 800; }
  .row-btn.lock { background: #F6F4EA; }
  .cat-empty { padding: 18px 4px; font-size: 17px; color: var(--muted); }
  .tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .task-btn {
    width: 100%; text-align: left; font: inherit; color: var(--text);
    background: var(--card); border: 2px solid var(--ink); border-radius: 4px 14px 4px 14px;
    padding: 14px 16px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: baseline;
  }
  .task-btn:hover { background: var(--mark-bg); }
  .task-no { font-size: 30px; color: var(--ink); grid-row: span 2; }
  .task-title { font-weight: 800; }
  .task-cond { font-size: 16px; color: var(--muted); }

  .condition { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .condition .no { font-size: 15px; color: var(--muted); font-weight: 700; }
  .condition .txt { font-size: 28px; color: var(--ink); line-height: 1.3; margin-top: 2px; }
  .condition .txt.long { font-size: 24px; }

  .notebook { margin: 0 0 16px; min-height: 8px; }
  .nline { font-size: 24px; color: var(--ink); line-height: 1.35; padding-left: 6px; border-left: 3px solid var(--ink); margin-bottom: 4px; }

  .dots { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: transparent; }
  .dot.done { background: var(--ink); }
  .dot.cur { background: var(--mark-bg); box-shadow: 0 0 0 3px var(--mark-bg); }

  .step { background: var(--card); border: 2px solid var(--ink); border-radius: 14px 4px 14px 4px; padding: 16px; }
  .step .meta { font-size: 15px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .q { font-size: 21px; font-weight: 700; line-height: 1.4; margin: 0 0 14px; }

  /* голос Листика */
  .voice { display: flex; gap: 10px; align-items: flex-end; margin: 0 0 14px; }
  .bubble {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 14px 14px 14px 2px;
    padding: 8px 14px; font-size: 17px; line-height: 1.4; min-height: 42px; display: flex; align-items: center;
  }
  .dots3 { display: inline-flex; gap: 5px; }
  .dots3 i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); opacity: .35; animation: bob 1s infinite; }
  .dots3 i:nth-child(2) { animation-delay: .15s; }
  .dots3 i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .opts { display: grid; gap: 10px; }
  .opt {
    font: inherit; font-weight: 700; text-align: left; color: var(--text);
    background: var(--paper); border: 2px solid var(--line); border-radius: 10px;
    padding: 12px 14px; min-height: 56px; cursor: pointer; touch-action: manipulation;
  }
  .opt:hover:not(:disabled) { border-color: var(--ink); background: var(--mark-bg); }
  .opt.wrong { border-color: var(--red); background: var(--bad-bg); text-decoration: line-through; cursor: default; }

  /* поля ответа и клавиатура */
  .fields { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
  .field { display: grid; gap: 4px; font-weight: 700; font-size: 16px; }
  .disp {
    font: inherit; font-size: 34px; font-weight: 800; color: var(--ink); text-align: center;
    min-width: 120px; height: 64px; padding: 0 16px; background: var(--paper);
    border: 3px solid var(--line); border-radius: 12px; cursor: pointer; touch-action: manipulation;
  }
  .disp.active { border-color: var(--ink); background: var(--mark-bg); }
  .disp.active .val::after { content: ""; display: inline-block; height: 1em; border-right: 3px solid var(--ink); margin-left: 2px; vertical-align: -0.12em; animation: blink 1s steps(1) infinite; }
  .disp .ph { color: var(--muted); opacity: .6; }
  @keyframes blink { 50% { opacity: 0; } }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 340px; margin-top: 14px; user-select: none; -webkit-user-select: none; }
  .key {
    font: inherit; font-size: 28px; font-weight: 800; color: var(--text);
    background: var(--paper); border: 2px solid var(--line); border-radius: 12px;
    height: 62px; cursor: pointer; touch-action: manipulation;
  }
  .key:active { background: var(--mark-bg); border-color: var(--ink); }
  .key.go { background: var(--ink); border-color: var(--ink); color: var(--btn-text); font-size: 16px; }
  .key.erase { font-size: 24px; }

  input.num {
    font: inherit; font-size: 26px; font-weight: 800; color: var(--ink);
    width: 132px; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper);
  }
  input.inp {
    font: inherit; font-size: 18px; color: var(--text); width: 100%; max-width: 360px;
    padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--card);
  }
  input.pin { font-size: 26px; font-weight: 800; letter-spacing: 8px; width: 150px; text-align: center; color: var(--ink); border-color: var(--ink); }
  .form label { display: grid; gap: 4px; font-weight: 700; font-size: 16px; margin-bottom: 12px; }
  .form .hint { font-weight: 400; font-size: 14px; color: var(--muted); max-width: 46ch; }
  .form .chk { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 15px; }
  .form .chk input { width: 22px; height: 22px; margin-top: 2px; flex: none; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs .btn { min-height: 44px; padding: 6px 16px; font-size: 16px; }
  .tabs .btn.on { background: var(--ink); color: var(--btn-text); }
  .bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 8px 0 16px; }
  .stat { border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--card); }
  .stat b { display: block; font-size: 26px; color: var(--ink); line-height: 1.2; }
  .stat span { font-size: 14px; color: var(--muted); }
  .cabinfo { display: grid; gap: 4px; }
  .rowitem { border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--card); margin-bottom: 10px; }
  .rowitem .top2 { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-weight: 700; margin-bottom: 6px; }
  .rowitem .sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .tag { display: inline-block; font-size: 14px; font-weight: 700; border-radius: 8px; padding: 2px 8px; border: 2px solid var(--line); }
  .tag.good { border-color: var(--green); color: var(--green); }
  .tag.train { border-color: var(--ink); color: var(--ink); }
  .tag.repeat { border-color: var(--red); color: var(--red); }
  .tabs { flex-wrap: wrap; }
  .pc-card { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--card); margin-bottom: 12px; }
  .pc-hero { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; background: var(--tint); border-color: #BFE6CE; }
  .pc-hero .nm { display: block; font-size: 24px; line-height: 1.2; }
  .pc-hero span { color: var(--muted); }
  .pc-meta { font-size: 15px; color: var(--muted); }
  .pc-plan { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .pc-plan span { flex: 1; min-width: 200px; color: var(--muted); }
  .pc-plan.on { border-color: var(--green); }
  .pc-meter { margin-bottom: 12px; }
  .pc-meter .top2 { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-weight: 700; margin-bottom: 6px; }
  .pc-tip2 { border-left: 5px solid var(--line); background: var(--card); border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; box-shadow: 0 0 0 2px var(--line) inset; }
  .pc-tip2 b { display: block; margin-bottom: 4px; }
  .pc-tip2.warn { border-left-color: var(--red); }
  .pc-tip2.ok { border-left-color: var(--green); }
  .pc-tip2 .tag { margin: 2px 4px 2px 0; }
  .pc-trend { display: grid; gap: 2px; background: var(--tint); border-color: #BFE6CE; }
  .pc-trend span { color: var(--muted); }
  .pc-chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .pc-gl { stroke: var(--line); stroke-width: 1; }
  .pc-ax { font-size: 12px; fill: #4B5575; }
  .pc-dt { margin-top: 8px; font-size: 15px; }
  .pc-dt summary { cursor: pointer; color: var(--muted); font-weight: 700; }
  .pc-scroll { overflow-x: auto; }
  .pc-dt table, .pc-tbl { width: 100%; border-collapse: collapse; }
  .pc-dt td, .pc-dt th, .pc-tbl td, .pc-tbl th { text-align: left; padding: 6px 8px; border-top: 1px solid var(--line); }
  .pc-tbl th { font-size: 14px; color: var(--muted); }
  .pc-tip { position: fixed; z-index: 90; background: var(--ink); color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 15px; pointer-events: none; max-width: 260px; }
  .pc-tip b { display: block; }
  h2.sec { font-size: 19.8px; margin: 26px 0 10px; }
  input.inp:focus-visible, input.pin:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  input.num:focus-visible, .btn:focus-visible, .opt:focus-visible, .task-btn:focus-visible, .back:focus-visible,
  .key:focus-visible, .disp:focus-visible {
    outline: 3px solid var(--red); outline-offset: 2px;
  }

  .btn {
    font: inherit; font-weight: 800; font-size: 18px;
    background: var(--ink); color: var(--btn-text); border: 2px solid var(--ink);
    border-radius: 10px; padding: 10px 20px; min-height: 48px; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn.small { font-size: 15px; min-height: 40px; padding: 6px 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

  .fb { border-radius: 10px; padding: 12px 14px; margin-top: 12px; font-size: 18px; }
  .fb.ok { background: var(--ok-bg); border: 2px solid var(--green); }
  .fb.bad { background: var(--bad-bg); border: 2px solid var(--red); }
  .fb strong.g { color: var(--green); }
  .fb strong.r { color: var(--red); }
  .mark { background: var(--mark-bg); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
  .mark b { font-weight: 800; }
  textarea.ex { width: 100%; min-height: 110px; font: inherit; font-size: 20px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line, #cfd8d2); resize: vertical; box-sizing: border-box; }
  .quizc { margin-bottom: 14px; }
  .quizc .row { margin-top: 10px; gap: 8px; }
  .fb.calm { background: var(--mark-bg); border: 2px solid #BFE6CE; }
  .tile .rc { position: absolute; top: 2px; right: 6px; font-size: 14px; color: #E0A800; }
  .recm { font-style: normal; font-weight: 700; color: #B07F00; white-space: nowrap; }
  .pop { animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.96); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    .pop, .dots3 i, .disp.active .val::after { animation: none; }
    .dots3 i { opacity: .8; }
  }

  .sum { background: var(--card); border: 2px solid var(--ink); border-radius: 14px 4px 14px 4px; padding: 18px; }
  .sum h2 { font-size: 23.4px; color: var(--ink); margin-bottom: 10px; }
  .sum p { margin: 0 0 10px; }
  .foot { margin-top: 28px; font-size: 14px; color: var(--muted); max-width: 52ch; }
  .foot p { margin: 0 0 8px; }
  .top { flex-wrap: wrap; }
  .tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .snd, .speak {
    font: inherit; font-size: 15px; font-weight: 700; background: transparent; color: var(--ink);
    border: 2px solid var(--line); border-radius: 10px; padding: 4px 12px; min-height: 40px; cursor: pointer; touch-action: manipulation;
  }
  .snd:hover, .speak:hover { border-color: var(--ink); background: var(--mark-bg); }
  .snd:focus-visible, .speak:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .meta-row .meta { margin: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .qline { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 14px; }
  .qline a { color: var(--green); }

  /* ===== Дизайн «Тетрадь» (из Claude Design) ===== */
  body { background-size: 28px 28px; background-position: 0 0; background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px), linear-gradient(to bottom, var(--grid) 1px, transparent 1px); }
  body.plain { background-image: none; }
  body::before { display: none; }
  .sheet { max-width: 820px; margin: 0 auto; padding: 24px 24px 72px; }
  .sheet.wide { max-width: 1120px; }
  @media (min-width: 700px) { .sheet { padding-left: 24px; } }
  .hand { font-family: "Caveat", "Segoe Script", cursive; font-weight: 600; }
  h1,h2 { font-family:var(--head); font-weight:800; letter-spacing:-0.025em; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--pen) !important; outline-offset: 3px !important; }

<script>
/* ============================================================
   БАНК ЗАДАЧ. Браузер получает от сервера только условия и варианты (GET /api/tasks).
   Ответы, правила и фразы «верно» хранятся на сервере и приходят после проверки.
   Правильность ответа проверяет сервер, не нейросеть.
   Типы шагов:
     choice — выбор из вариантов (correct — номер верного, с нуля)
     number — одно число (answer)
     pair   — два числа по порядку полей (fields, answer)
   q — вопрос, rule — правило при ошибке, ok — фраза при верном ответе,
   note — строка в тетрадь, skill — тема шага (единственное, что знает ИИ).
   ============================================================ */
let TASKS = [];        // с сервера, без ответов
let USER = null;       // вошедший кабинет: { email, child, parent } или null
let OFFER = { diag: false, warm: 0 };   // что предложить ребёнку: знакомство или разминка (только после входа)
async function loadOffer() {
  if (!USER) { OFFER = { diag: false, warm: 0 }; return; }
  try { const r = await api("/api/quiz/offer"); if (r.status === 200 && r.data) OFFER = { diag: !!r.data.diag, warm: r.data.warm || 0 }; } catch (e) {}
}

/* ============================================================
   ГОЛОС ЛИСТИКА.
   ИИ здесь только подбадривает. Он НЕ проверяет ответы, НЕ видит
   вопросов, ответов и того, что набрал ребёнок. Ему передаётся
   лишь тип события («ребёнок ошибся второй раз») и название темы.
   Ответ ИИ проходит проверку; если что-то не так или ИИ недоступен,
   показывается заготовленная фраза.
   ============================================================ */
let CANNED = {};     // из data/public/phrases.json
let SITUATION = {};  // из data/public/phrases.json

let BANNED = /(?!)/;   // из data/prompts.json (до загрузки ничего не совпадает)
let PROMPT_TEMPLATE = "";  // из data/prompts.json

function cleanVoice(t) {
  if (typeof t !== "string") return null;
  t = t.trim().replace(/^["«“]+|["»”]+$/g, "").trim();
  if (t.length < 8 || t.length > 220) return null;
  if (/\d/.test(t)) return null;
  if (/\?/.test(t)) return null;
  if (/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/u.test(t)) return null;
  if (BANNED.test(t)) return null;
  if (!/[а-яё]/i.test(t)) return null;
  return t;
}

let SAMPLE = null;
let SAMPLE_STATE = "pending";   // pending | ok | none
const AI = { on: true, denied: false };
let voiceSeq = 0;
const lastPick = {};

if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("sample").then(fn => {
    SAMPLE = fn || null;
    SAMPLE_STATE = fn ? "ok" : "none";
    if (S && S.view === "home") render();
  }).catch(() => { SAMPLE_STATE = "none"; if (S && S.view === "home") render(); });
} else {
  SAMPLE_STATE = "none";
}

function pickCanned(ev) {
  const arr = CANNED[ev];
  let i = Math.floor(Math.random() * arr.length);
  if (arr.length > 1 && i === lastPick[ev]) i = (i + 1) % arr.length;
  lastPick[ev] = i;
  return arr[i];
}

async function askVoice(ev, skill) {
  if (!SAMPLE || !AI.on) return null;
  const prompt = PROMPT_TEMPLATE.replace("{situation}", SITUATION[ev].replace("{skill}", skill || "математика"));
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 12000);
  try {
    const res = await SAMPLE(prompt, { modelTier: "quick", cache: false, signal: ctl.signal });
    return cleanVoice(res && res.text);
  } catch (e) {
    if (e && e.code === "not_granted") { AI.on = false; AI.denied = true; }
    return null;
  } finally {
    clearTimeout(timer);
  }
}

function say(ev, skill) {
  if (ev !== "locked") return;   // болтливые фразы («ты молодец», «ничего страшного», «попробуем ещё раз») не показываем; оставлена только пауза при блокировке шага
  if (VOICE.active) return;   // в режиме живого голоса говорит Листик из голосовой связи
  const id = ++voiceSeq;
  const canned = pickCanned(ev);
  const useAI = !!(SAMPLE && AI.on);
  S.voice = { id, text: useAI ? "" : canned, loading: useAI };
  if (!useAI) { speak(canned); return; }
  setTimeout(() => {
    if (S.voice && S.voice.id === id && S.voice.loading) {
      S.voice = { id, text: canned, loading: false };
      paintVoice();
      speak(canned);
    }
  }, 6000);
  askVoice(ev, skill).then(v => {
    if (!S.voice || S.voice.id !== id || !S.voice.loading) return;
    S.voice = { id, text: v || canned, loading: false };
    paintVoice();
    speak(S.voice.text);
  });
}

/* ---------- озвучка (встроенный голос браузера) ---------- */
const TTS = { on: true, ok: !!(window.speechSynthesis && window.SpeechSynthesisUtterance), voice: null };
function pickRuVoice() {
  if (!TTS.ok) return;

}
if (TTS.ok) {

}
function spokenMath(s) {
  return String(s)
    .replace(/<[^>]*>/g, " ")
    .replace(/\(/g, " в скобках ").replace(/\)/g, " ")
    .replace(/\s:\s/g, " разделить на ")
    .replace(/[·×]/g, " умножить на ")
    .replace(/−/g, " минус ")
    .replace(/\+/g, " плюс ")
    .replace(/=/g, " равно ")
    .replace(/\bx\b/gi, " икс ")

    .replace(/\s+/g, " ").trim();
}
const LB = { token: 0, st: null, counts: [], cur: -1 };   // доска мини-урока
function stopSpeech() { LB.token++; try { VOICE.interrupt(); } catch (e) {} if (TTS.ok) { try { speechSynthesis.cancel(); } catch (e) {} } }
function speak(text, force) {
  if (VOICE.quiet || VOICE.active || (VOICE.available && !VOICE.err)) return;   // говорит живой Листик, а не голос браузера; в тихом режиме молчим
  if (!TTS.ok || (!TTS.on && !force) || !text) return;

    speechSynthesis.cancel();

}
function ttsNote() {

  return "<p>Листик читает свои слова вслух голосом устройства. Он звучит как робот, зато работает без интернета. Кнопка 🔊 у вопроса читает вопрос.</p>";
}

/* Выбор из мастера (start.html): ?lang=ru&subject=math&grade=3&section=equations.
   Если раздел выбран, задачи идут по очереди, одна за другой. */
const PARAMS = new URLSearchParams(location.search);
if (PARAMS.get("lang") === "kk") document.documentElement.lang = "kk";
let QUEUE = null;   // номера задач выбранного раздела по порядку
let QPOS = -1;      // место текущей задачи в очереди
function buildQueue() {
  const sec = PARAMS.get("section");
  if (!sec) return;
  const q = [];
  TASKS.forEach((t, i) => { if (t.section === sec) q.push(i); });

}

/* Шаги-опоры (scaf), которые сервер решил не показывать, потому что ребёнок уверенно владеет навыком */
const visIdx = T => T.steps.map((x, i) => x.skip ? -1 : i).filter(i => i >= 0);
const vpos = (T, i) => visIdx(T).indexOf(i) + 1;
const vnext = (T, i) => { for (let k = i + 1; k < T.steps.length; k++) if (!T.steps[k].skip) return k; return -1; };
const vprev = (T, i) => { for (let k = i - 1; k >= 0; k--) if (!T.steps[k].skip) return k; return -1; };
function applySkip(T, skip) {
  T.steps.forEach((x, j) => {
    if (x.q0 === undefined) x.q0 = x.q;
    x.skip = skip.indexOf(j) >= 0;
    x.q = (skip.length && x.qs) ? x.qs : x.q0;
  });
}
function freshEntry(st) { return st.type === "pair" ? st.fields.map(() => "") : [""]; }

/* список задач лёгкий; шаги и урок приходят по запросу, когда задачу открывают */
async function ensureTask(i) {
  const t = TASKS[i];
  if (t.steps && t.steps.length) return true;
  let r;
  try { r = await api("/api/task/" + encodeURIComponent(t.id)); } catch (e) { r = { status: 0 }; }
  if (r.status === 200 && r.data && r.data.task) { TASKS[i] = Object.assign({}, t, r.data.task); return true; }
  if (r.status === 403) { TASKS[i].locked = true; S = { view: "paywall", t: i }; render(); return false; }
  S = { view: "home", flash: "Не получилось открыть задачу. Проверьте интернет и попробуйте ещё раз." }; render();
  return false;
}
async function startTask(i) {
  if (TASKS[i].locked) { S = { view: "paywall", t: i }; return render(); }
  if (USAGE.studyLeft === 0) { S = { view: "rest" }; return render(); }
  if (!(await ensureTask(i))) return;
  QPOS = QUEUE ? QUEUE.indexOf(i) : -1;
  let skip = [];
  try { const sr = await api("/api/start", { task: TASKS[i].id }); if (sr.status === 200 && sr.data && Array.isArray(sr.data.skip)) skip = sr.data.skip; } catch (e) {}
  applySkip(TASKS[i], skip);
  const first = Math.max(0, vnext(TASKS[i], -1));
  const st0 = TASKS[i].steps[first];
  S = {
    view: "task", t: i, s: first, attempts: 0, stage: "ask",
    wrong: [], errors: {}, helped: {}, notes: [],
    entry: freshEntry(st0), active: 0,
    adultOpen: false, adultPassed: false, adultErr: false, emptyMsg: false, voice: null,
    rule: null, similar: null, okText: "", netMsg: "", adultAnswer: null, busy: false
  };
  const LS = TASKS[i].lesson;
  if (LS && LS.cards && LS.cards.length) { S.stage = "lesson"; S.lc = 0; }
  say("start");
  render();
  VOICE.announce();
}

/* столбик на листочке: числа берём из условия, цифры и переносы появляются по мере верных шагов (их присылает сервер в ответе, поле col) */
function colHTML(T) {
  const m = /(\d+)\s*([+−])\s*(\d+)/.exec(T.condition || "");
  if (!m) return "";
  const add = m[2] === "+", A = m[1], B = m[3];
  const k = Math.max(A.length, B.length) + (add ? 1 : 0);
  const top = {}, dig = {}, car = {}, fresh = S.colNew || {};
  let all = null;
  Object.keys(S.cols || {}).map(Number).sort((x, y) => x - y).forEach(i => (S.cols[i] || []).forEach(o => {
    if (o.d) dig[o.d[0]] = o.d[1];
    if (o.c) car[o.c[0]] = o.c[1];
    if (o.t) top[o.t[0]] = o.t[1];
    if (o.all) all = String(o.all);
  }));
  const dgt = (str, p) => (p < str.length ? str[str.length - 1 - p] : "");
  const pos = j => k - 1 - j;            // j — столбец слева направо, p — разряд справа налево (0 — единицы)
  let r1 = '<span class="sg"></span>', r2 = '<span class="sg rl">' + (add ? "+" : "−") + '</span>', r3 = '<span class="sg"></span>';
  for (let j = 0; j < k; j++) {
    const p = pos(j), a0 = dgt(A, p), b0 = dgt(B, p);
    let c1 = "";
    if (car[p] !== undefined) c1 += '<i class="cr' + (fresh["c" + p] ? " pop" : "") + '">' + car[p] + "</i>";
    if (top[p] !== undefined && top[p] !== Number(a0)) {
      const v = String(top[p]);
      c1 += '<s class="old">' + a0 + "</s>" + '<b class="nw' + (v.length > 1 ? " two" : "") + (fresh["t" + p] ? " pop" : "") + '">' + v + "</b>";
    } else c1 += a0;
    r1 += '<span class="cc">' + c1 + "</span>";
    r2 += '<span class="cc rl">' + b0 + "</span>";
    let res = "";
    if (all !== null) res = dgt(all, p);
    else if (dig[p] !== undefined) res = String(dig[p]);
    r3 += '<span class="cc pen' + (fresh["d" + p] ? " pop" : "") + '">' + res + "</span>";
  }
  return '<div class="colm" style="--k:' + k + '" role="img" aria-label="Запись столбиком: ' + A + " " + m[2] + " " + B + '">' + r1 + r2 + r3 + "</div>";
}
function notebookAside(T, done) {
  if (T.quiz) return '';

/* родительский режим сам закрывается после 10 минут без действий (как и на сервере) */
let CAB_IDLE = null;
function cabIdleKick() { if (!CAB_IDLE) return; clearTimeout(CAB_IDLE.t); CAB_IDLE.t = setTimeout(cabIdleLeave, 10 * 60 * 1000); }
function cabIdleSet(on) {
  if (on && !CAB_IDLE) {
    CAB_IDLE = { t: null, fn: cabIdleKick };
    ["pointerdown", "keydown", "scroll"].forEach(e => window.addEventListener(e, CAB_IDLE.fn, { passive: true }));
    cabIdleKick();
  } else if (!on && CAB_IDLE) {
    clearTimeout(CAB_IDLE.t);
    ["pointerdown", "keydown", "scroll"].forEach(e => window.removeEventListener(e, CAB_IDLE.fn));
    CAB_IDLE = null;
  }
}
function cabIdleLeave() {
  cabIdleSet(false);
  if (USER) call("/api/parent/leave", {});
  if (USER) USER.parent = false;
  S = { view: "home", flash: "Кабинет родителя закрылся, потому что им долго не пользовались." };
  render();
}

  document.body.classList.toggle("plain", lesson);

  const parentScreen = S.view === "cabinet" || S.view === "pin" || S.view === "pinreset" || S.view === "auth";
  const kid = !!USER && !parentScreen;

  const shLogo = document.querySelector(".sh-logo"); if (shLogo) shLogo.setAttribute("href", kid ? "/listik.html" : "/");
  /* режим ребёнка: ссылки в подвале (телефон, WhatsApp, документы) не нажимаются; для родителя и гостя возвращаются */

    else if (a.dataset.href !== undefined) { a.setAttribute("href", a.dataset.href); delete a.dataset.href; a.removeAttribute("aria-disabled"); a.style.cursor = ""; }

  if (S.view === "cabinet") return renderCabinet();
  if (S.view === "done") return renderDone();
  if (S.view === "rest") return renderRest();
  if (S.view === "paywall") return renderPaywall();
  return renderTask();
}

function aiNote() {
  if (SAMPLE_STATE === "pending") return "";
  if (SAMPLE_STATE === "none") return "";

function pChart(kind, values, o) {

  setTimeout(() => {
    const hit = document.getElementById(id + "h"); if (!hit) return; const svg = hit.ownerSVGElement, cx = document.getElementById(id + "x");

async function openCabinet(tab, flash) {
  const r = await call("/api/cabinet");
  if (r.status === 200) { S = { view: "cabinet", tab: tab || "progress", cab: r.data, flash: flash || "" }; return render(); }
  if (r.status === 401) { USER = null; S = { view: "auth", mode: "login", err: "Войдите заново." }; return render(); }
  if (r.status === 403) { S = { view: "pin", err: "Введите PIN-код ещё раз." }; return render(); }

}

async function call(path, payload) {

}

async function doAuth(mode) {
  const email = val("fEmail").trim(), password = val("fPass");
  S.form = { email, childName: val("fChild"), agree: !!(document.getElementById("fAgree") || {}).checked };
  S.err = "";
  let payload = { email, password };
  if (mode === "register") {
    const pin = val("fPin");
    if (!need("Введите имя или псевдоним ребёнка.", S.form.childName.trim())) return;
    if (!need("Пароли не совпали. Проверьте раскладку клавиатуры.", password === val("fPass2"))) return;
    if (!need("PIN-коды не совпали.", pin === val("fPin2"))) return;
    if (!need("Нужно согласие на хранение данных.", S.form.agree)) return;
    payload = { email, password, pin, childName: S.form.childName };
  }
  const r = await call(mode === "register" ? "/api/register" : "/api/login", payload);
  if (r.status === 200) { USER = r.data.user; await reloadTasks(); S = { view: "home", flash: mode === "register" ? "Кабинет создан. Запомните PIN-код: он нужен для подсказок и входа в кабинет." : "" }; return render(); }

  render();
}

async function doForgot() {

  const r = await call("/api/password/forgot", { email });
  if (r.status === 200) { S.sent = true; S.err = ""; return render(); }

async function doReset() {
  const password = val("fPass");
  if (!need("Пароль должен быть не короче 8 символов.", password.length >= 8)) return;
  if (!need("Пароли не совпали. Проверьте раскладку клавиатуры.", password === val("fPass2"))) return;
  const r = await call("/api/password/reset", { token: S.token, password });
  if (r.status === 200) { USER = r.data.user; await reloadTasks(); S = { view: "home", flash: "Пароль изменён, вы вошли в кабинет." }; return render(); }
  S.err = r.status === 0 ? NET : r.status === 429 ? "Слишком много попыток. Подождите немного." : (r.data.message || "Не получилось. Запросите новую ссылку.");
  render();
}

let SECTIONS = [];

function catItem(t, i) {
  const lock = !!t.locked, cls = (lock ? " lock" : "") + (t.st === "done" ? " done" : t.st === "progress" ? " progress" : "");
  const mk = lock ? "🔒" : (ST_MARK[t.st] || "");

  if (HOME.view === "list") {
    return '<li><button class="row-btn' + cls + (t.title === "Задача" ? " word" : "") + '" data-action="start" data-i="' + i + '" aria-label="' + label + '">' +
      '<span class="rno">' + esc(t.no) + '</span><span class="rtx">' + (t.title !== "Задача" ? '<b>' + esc(t.title) + '</b>' : '') +
      (t.rec ? ' <em class="recm">★ ' + REC_TXT[t.rec] + '</em> ' : '') + (lock ? 'по подписке' : esc(t.cond || "")) + '</span><span class="rst">' + mk + '</span></button></li>';
  }
  return '<li><button class="tile' + cls + '" data-action="start" data-i="' + i + '" aria-label="' + label + '" title="' + esc(lock ? t.title : (t.cond || t.title)) + '">' +
    esc(t.no) + (mk ? '<span class="mk" aria-hidden="true">' + mk + '</span>' : '') + (t.rec ? '<span class="rc" title="Рекомендуем: ' + REC_TXT[t.rec] + '" aria-hidden="true">★</span>' : '') + '</button></li>';
}
function catItems(idx) {
  return '<ul class="' + (HOME.view === "list" ? "rows" : "tiles") + '">' + idx.map(i => catItem(TASKS[i], i)).join("") + '</ul>';
}
function catGroups() {
  const by = {}, order = [];
  TASKS.forEach((t, i) => { if (t.quiz) return; const k = t.section || "_other"; if (!by[k]) { by[k] = []; order.push(k); } by[k].push(i); });
  const list = SECTIONS.map(x => ({ id: x.id, title: x.title }));
  order.forEach(k => { if (!list.some(x => x.id === k)) list.push({ id: k, title: "Другие задачи" }); });
  return list.map(x => ({ id: x.id, title: x.title, idx: by[x.id] || [] }));
}
function catListHTML() {
  const q = HOME.q.trim().toLowerCase();
  const scope = QUEUE || TASKS.map((_, i) => i).filter(i => !TASKS[i].quiz);
  if (q) {
    const hit = scope.filter(i => { const t = TASKS[i]; return String(t.no).toLowerCase() === q || String(t.no).toLowerCase().startsWith(q) || (t.cond || "").toLowerCase().includes(q) || (t.title || "").toLowerCase().includes(q); });
    if (!hit.length) return '<p class="cat-empty">Ничего не нашлось. Проверьте номер или попробуйте другое слово.</p>';
    return '<p class="cat-meta">Найдено: ' + hit.length + (hit.length > 100 ? ' (показаны первые 100, уточните запрос)' : '') + '</p>' + catItems(hit.slice(0, 100));
  }
  const groups = catGroups().filter(g => !QUEUE || g.idx.some(i => QUEUE.indexOf(i) >= 0));
  if (QUEUE) {
    const g = groups[0];
    const done = QUEUE.filter(i => TASKS[i].st === "done").length;
    return '<p class="cat-meta">' + esc(g ? g.title : "Раздел") + ' · ' + QUEUE.length + ' задач' + (USER ? ', решено ' + done : '') + ' · <a href="' + (listHref() || 'start.html') + '">Выбрать другой раздел</a></p>' + catItems(QUEUE);
  }
  return groups.map(g => {
    const done = g.idx.filter(i => TASKS[i].st === "done").length;
    return '<section class="grp2"><h2 class="grp2-h"><span class="gt">' + esc(g.title) + '</span><span class="gc">' + (USER && g.idx.length ? '<b>' + done + '</b> из ' + g.idx.length : g.idx.length + ' ' + plural(g.idx.length, "задача", "задачи", "задач")) + '</span></h2>' +
      (g.idx.length ? catItems(g.idx) : '<p class="grp2-empty">Задач пока нет</p>') + '</section>';
  }).join("");
}

async function startQuiz(kind) {
  let r; try { r = await api("/api/quiz/start", { kind }); } catch (e) { r = { status: 0, data: {} }; }
  if (r.status === 401) { USER = null; S = { view: "auth", mode: "login", err: "Войдите в кабинет, чтобы пройти знакомство." }; return render(); }
  if (r.status === 403 && r.data && r.data.error === "day_limit") { USAGE.studyLeft = 0; return endOfDay(); }
  if (r.status !== 200 || !r.data || !r.data.task) { S = { view: "home", flash: r.status === 409 ? "Сегодня разминка не нужна." : "Не получилось начать. Попробуй ещё раз." }; return render(); }
  TASKS = TASKS.filter(t => !t.quiz); TASKS.push(r.data.task);
  return startTask(TASKS.length - 1);
}

/* ---------- доска с корзинами (мини-урок с полем board) ----------
   В tasks.json: lesson.board = {nb, per}, у карточки cards[i].board = {fill:[4,4,0], sums:true, eq:"3×4=12", legend:true}.
   Поля карточки дополняют то, что уже на доске. */
const LB_NS = "http://www.w3.org/2000/svg";
const LB_CENTERS = { 1: [180], 2: [110, 250], 3: [60, 180, 300] };
const LB_SPOTS = {
  1: [[0, 100]], 2: [[-19, 100], [19, 100]], 3: [[-19, 100], [19, 100], [0, 64]],
  4: [[-19, 100], [19, 100], [-19, 64], [19, 64]], 5: [[-19, 100], [19, 100], [-19, 64], [19, 64], [0, 28]]
};
function lbEl(tag, attrs, parent) { const n = document.createElementNS(LB_NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
function lbBuild() {
  const svg = document.getElementById("lbsvg"), B = LB.st; if (!svg) return;
  svg.innerHTML = ""; LB.counts = [];
  // верх рисунка зависит от того, сколько рядов яблок бывает в корзине; кружок с суммой стоит над самым высоким яблоком
  const top = Math.min.apply(null, (LB_SPOTS[B.per] || LB_SPOTS[4]).map(p => p[1])), badgeY = top - 44, y0 = badgeY - 22;
  svg.setAttribute("viewBox", "0 " + y0 + " 360 " + (232 - y0));
  LB_CENTERS[B.nb].forEach((cx, i) => {
    const g = lbEl("g", { transform: "translate(" + cx + ",0)" }, svg);
    lbEl("g", { "class": "lb-apples" }, g);
    const body = lbEl("g", {}, g);
    lbEl("path", { d: "M-50 112 L50 112 L42 188 Q41 196 33 196 L-33 196 Q-41 196 -42 188Z", fill: "#B87A3E" }, body);
    lbEl("path", { d: "M-46 134 H46 M-44 156 H44 M-42 176 H42", stroke: "#8F5A28", "stroke-width": 2.5, fill: "none", "stroke-linecap": "round" }, body);
    lbEl("rect", { x: -54, y: 106, width: 108, height: 12, rx: 6, fill: "#8F5A28" }, body);
    lbEl("text", { "class": "lb-tag", x: 0, y: 170 }, body).textContent = "по " + B.per;
    lbEl("text", { x: 0, y: 220, "text-anchor": "middle", "font-size": 14, "font-weight": 700, fill: "#4B5575", "font-family": "inherit" }, g).textContent = "корзина " + (i + 1);
    const badge = lbEl("g", { "class": "lb-badgeg", transform: "translate(0," + badgeY + ")", style: "display:none" }, g);
    const inner = lbEl("g", { "class": "lb-badgein" }, badge);   // анимация на внутреннем элементе, чтобы не сбить положение кружка
    lbEl("circle", { "class": "lb-badge-bg", r: 19 }, inner);
    lbEl("text", { "class": "lb-badge-tx", y: 6 }, inner);
    LB.counts.push(0);
  });
}
function lbApple(i, k, animate) {
  const svg = document.getElementById("lbsvg"), B = LB.st;
  const s = (LB_SPOTS[B.per] || LB_SPOTS[4])[k];
  const holder = svg.children[i].querySelector(".lb-apples");
  const pos = lbEl("g", { transform: "translate(" + s[0] + "," + s[1] + ")" }, holder);
  const a = lbEl("g", { "class": animate ? "lb-apple-in" : "" }, pos);
  lbEl("circle", { r: 17, fill: "#D9413A" }, a);
  lbEl("circle", { cx: -6, cy: -6, r: 4.5, fill: "#fff", opacity: .35 }, a);
  lbEl("path", { d: "M0 -16 Q1 -22 5 -24", stroke: "#8F5A28", "stroke-width": 2.5, fill: "none", "stroke-linecap": "round" }, a);
  lbEl("path", { d: "M2 -19 Q10 -28 17 -20 Q9 -14 2 -19Z", fill: "#1F7A45" }, a);
}
function lbDraw(animate) {
  const svg = document.getElementById("lbsvg"), B = LB.st; if (!svg) return;
  B.fill.forEach((n, i) => {
    const holder = svg.children[i].querySelector(".lb-apples");
    while (LB.counts[i] > n) { holder.removeChild(holder.lastChild); LB.counts[i]--; }
    while (LB.counts[i] < n) { lbApple(i, LB.counts[i], animate); LB.counts[i]++; }
  });
  let run = 0;
  B.fill.forEach((n, i) => {
    run += n;
    const g = svg.children[i].querySelector(".lb-badgeg");
    if (B.sums && n > 0) {
      const was = g.style.display !== "none";
      g.style.display = ""; g.querySelector("text").textContent = run;
      g.querySelector(".lb-badgein").setAttribute("class", "lb-badgein" + (was || !animate ? "" : " lb-badge"));
    } else g.style.display = "none";
  });
  const eq = document.getElementById("lbeq");
  if (eq) eq.textContent = (B.eq || "").replace(/([+×=])/g, " $1 ").replace(/\s+/g, " ").trim();
  const lg = document.getElementById("lbleg");
  if (lg) {
    lg.innerHTML = "";
    if (B.legend && B.nb > 1) [[B.nb, "сколько групп (корзин)", "g"], [B.per, "сколько в каждой группе", ""]].forEach(it => {
      const c = document.createElement("span"); c.className = "lb-chip " + it[2];
      const b = document.createElement("b"); b.textContent = it[0];
      c.appendChild(b); c.appendChild(document.createTextNode(it[1])); lg.appendChild(c);
    });
  }
}
function lbApply(upd, animate) {
  const B = LB.st; if (!upd) return;
  const rebuild = (upd.nb && upd.nb !== B.nb) || (upd.per && upd.per !== B.per);
  Object.assign(B, upd);
  B.fill = Array.from({ length: B.nb }, (_, i) => Math.min(B.per, (B.fill && B.fill[i]) || 0));
  if (rebuild) lbBuild();
  lbDraw(animate);
}
function lbInit(L) {
  LB.st = { nb: L.board.nb || 3, per: L.board.per || 4, fill: [], sums: false, legend: false, eq: "" };
  lbBuild();
  const first = L.cards.find(c => c.board);
  lbApply(first ? first.board : {}, false);
  LB.cur = first ? L.cards.indexOf(first) : -1;
  lbMark(LB.cur);
}
function lbMark(i) {
  document.querySelectorAll(".lscene").forEach(el => el.classList.toggle("cur", +el.dataset.i === i));
}
function lbShowCard(i, animate) {
  const c = TASKS[S.t].lesson.cards[i]; if (!c) return;
  if (c.board) lbApply(c.board, animate !== false);
  LB.cur = i; lbMark(i);
  const el = document.querySelector('.lscene[data-i="' + i + '"]');
  if (el) { try { el.scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (e) {} }
}
/* Произносит карточку голосом браузера и вызывает done, когда договорил. Если голоса нет или говорит живой Листик, ждёт по времени чтения. */
function lbSay(text, done) {
  const t = spokenMath(plain(text));
  if (!TTS.ok || !TTS.on || VOICE.quiet || VOICE.active) { setTimeout(done, 700 + t.length * 45); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "ru-RU"; if (TTS.voice) u.voice = TTS.voice;
    u.rate = 0.95; u.pitch = 1.1;
    let fin = false; const f = () => { if (!fin) { fin = true; done(); } };
    u.onend = f; u.onerror = f;
    speechSynthesis.speak(u);
    setTimeout(f, 5000 + t.length * 120);
  } catch (e) { done(); }
}
function lbPlayAll() {
  const cards = TASKS[S.t].lesson.cards;
  stopSpeech();
  const my = ++LB.token;
  let i = 0;
  const next = () => {
    if (my !== LB.token || S.stage !== "lesson" || i >= cards.length) return;
    const k = i++;
    lbShowCard(k);
    lbSay(cards[k].text, () => { if (my === LB.token) setTimeout(next, 500); });
  };
  next();
}
function lbPlayOne(i) {
  stopSpeech();
  lbShowCard(i);
  lbSay(TASKS[S.t].lesson.cards[i].text, () => {});
}

async function submit(answer, pickedIndex, ch) {
  if (S.busy) return;
  const my = S, T = TASKS[S.t], st = T.steps[S.s], stepNo = S.s;
  S.busy = true; S.netMsg = ""; S.emptyMsg = false;
  let r;
  try { r = await api("/api/check", { task: T.id, step: stepNo, answer, ch: ch === "voice" ? "voice" : "tap" }); }
  catch (e) { my.busy = false; my.netMsg = "Нет связи. Попробуй ещё раз."; VOICE.onResult({ kind: "error", msg: "нет связи с сервером" }); return S === my && render(); }
  my.busy = false;
  if (S !== my || my.s !== stepNo) { VOICE.onResult({ kind: "error", msg: "шаг уже сменился" }); return; }
  if (r.status === 403 && r.data && r.data.error === "paid_only") { S = { view: "paywall", t: my.t }; return render(); }
  if (r.status === 403 && r.data && r.data.error === "day_limit") { USAGE.studyLeft = 0; return endOfDay(); }
  if (r.status === 429) { my.netMsg = "Слишком много попыток. Подожди минуту."; VOICE.onResult({ kind: "error", msg: "слишком много попыток, нужно подождать минуту" }); return render(); }
  if (r.status !== 200 && r.status !== 423) { my.netMsg = "Что-то пошло не так. Обнови страницу."; VOICE.onResult({ kind: "error", msg: "ошибка сервера" }); return render(); }
  const d = r.data;
  if (d.quizDone) S.quizSum = d.quizDone;
  if (d.correct) {
    S.stage = "right"; S.okText = d.ok || "";
    (S.oks = S.oks || {})[S.s] = S.okText;      // запоминаем, чтобы можно было вернуться на этот шаг
    if (d.note) S.notes.push(d.note);
    if (d.col) {                                  // цифры столбика на листочке
      (S.cols = S.cols || {})[stepNo] = d.col;
      S.colNew = {};
      d.col.forEach(o => { if (o.d) S.colNew["d" + o.d[0]] = 1; if (o.c) S.colNew["c" + o.c[0]] = 1; if (o.t) S.colNew["t" + o.t[0]] = 1; });
    } else S.colNew = {};
    const am = /Ответ:\s*(.+)$/.exec(d.ok || "");
    if (am) S.notes.push("Ответ: " + am[1]);
    say((S.errors[S.s] || 0) > 0 ? "rightAfter" : "right", st.skill);
    VOICE.onResult({ kind: "correct", ok: d.ok, note: d.note, say: d.say });
  } else if (d.moveOn) {
    S.stage = "right"; S.okText = T.quiz === "diag" ? "Хорошо, идём дальше." : "Ничего страшного, идём дальше.";
    (S.oks = S.oks || {})[S.s] = S.okText; (S.mv = S.mv || {})[S.s] = true;
    VOICE.onResult({ kind: "moveon" });
  } else if (r.status === 423) {
    S.stage = "locked"; S.rule = d.rule;
    VOICE.onResult({ kind: "locked", rule: d.rule });
  } else {
    S.errors[S.s] = (S.errors[S.s] || 0) + 1;
    S.attempts = d.attempts; S.rule = d.rule; S.similar = d.similar || null;
    if (d.tired) S.calm = d.tired;
    if (pickedIndex !== undefined) S.wrong.push(pickedIndex);
    if (st.type !== "explain") S.entry = freshEntry(st);
    S.active = 0;
    if (d.locked) { S.stage = "locked"; say("locked", st.skill); }
    else say(S.attempts === 1 ? "wrong1" : "wrong2", st.skill);
    VOICE.onResult({ kind: "wrong", attempts: d.attempts, rule: d.rule, similar: d.similar || null, locked: !!d.locked, tired: d.tired || null, say: d.say });
  }
  render();
}

function openAdult() { S.adultOpen = true; S.netMsg = ""; S.adultErr = false; render(); }

async function unlock(value) {
  if (S.busy) return;
  const my = S, T = TASKS[S.t];
  S.busy = true; S.netMsg = "";
  let r;
  try { r = await api("/api/unlock", { task: T.id, step: S.s, pin: value }); }
  catch (e) { my.busy = false; my.netMsg = "Нет связи."; return S === my && render(); }
  my.busy = false;
  if (S !== my) return;
  if (r.status === 403) { USER = null; my.netMsg = "Вход в кабинет закончился. Вернитесь на главную и войдите заново."; }
  else if (r.status === 429) my.adultErr = "limit";
  else if (r.data && r.data.ok) { my.adultPassed = true; my.helped[my.s] = true; my.adultErr = false; my.adultAnswer = r.data.answer_text || null; }
  else my.adultErr = true;
  render();
}

function digit(d) {
  if (S.entry[S.active].length >= 4) return;
  S.entry[S.active] = S.entry[S.active] === "0" ? d : S.entry[S.active] + d;
  S.emptyMsg = false;
  render();
}
function backspace() {
  S.entry[S.active] = S.entry[S.active].slice(0, -1);
  render();
}

function checkTyped() {
  const st = TASKS[S.t].steps[S.s];
  const vals = S.entry.map(v => v === "" ? NaN : parseInt(v, 10));
  if (vals.every(isNaN)) { S.emptyMsg = true; return render(); }
  const missing = vals.findIndex(isNaN);
  if (missing !== -1) { S.active = missing; S.emptyMsg = false; return render(); }
  submit(st.type === "number" ? vals[0] : vals);
}

function nextStep() {
  const T = TASKS[S.t];
  if (vnext(T, S.s) < 0) {
    S.view = "done"; S.voice = null;
    render();
    say("done");
    paintVoice();
    VOICE.announce();
    return;
  }
  stopSpeech();
  S.s = vnext(T, S.s); S.attempts = 0; S.stage = "ask"; S.wrong = []; S.voice = null; S.calm = "";
  S.entry = freshEntry(T.steps[S.s]); S.active = 0;
  S.adultOpen = false; S.adultPassed = false; S.adultErr = false; S.emptyMsg = false;
  S.rule = null; S.similar = null; S.okText = ""; S.netMsg = ""; S.adultAnswer = null;
  if (S.oks && S.oks[S.s] !== undefined) { S.stage = "right"; S.okText = S.oks[S.s]; }   // шаг уже решён: показываем ответ, а не задаём заново
  render();
  VOICE.announce();
}

/* кнопка «Назад»: возвращает на предыдущий (уже решённый) шаг, где можно перечитать вопрос и ответ */
function backBtn() {
  const T = TASKS[S.t], p = vprev(T, S.s);
  return p >= 0 ? '<button class="btn ghost small" data-action="prev">← Назад к шагу ' + vpos(T, p) + '</button>' : '';
}
function prevStep() {
  const T = TASKS[S.t];
  if (S.busy || vprev(T, S.s) < 0) return;
  stopSpeech();
  S.s = vprev(T, S.s); S.attempts = 0; S.wrong = []; S.voice = null; S.calm = "";
  S.entry = freshEntry(T.steps[S.s]); S.active = 0;
  S.adultOpen = false; S.adultPassed = false; S.adultErr = false; S.emptyMsg = false;
  S.rule = null; S.similar = null; S.netMsg = ""; S.adultAnswer = null;
  S.stage = "right"; S.okText = (S.oks && S.oks[S.s]) || "";
  render();
}

function renderQuizDone() {
  const T = TASKS[S.t], q = S.quizSum || { ok: 0, total: T.steps.length, weak: [], strong: [] };
  let h = lessonHeader(T, T.steps.length, true);
  h += '<div class="lesson"><section class="lcol"><div id="voiceslot">' + voiceHTML() + '</div><div class="sum"><h2>' + (T.quiz === "diag" ? "Мы познакомились!" : "Разминка готова!") + '</h2>';
  h += '<p>Сразу получилось: <b>' + q.ok + ' из ' + q.total + '</b>.</p>';
  if (q.strong.length) h += '<p><b>Хорошо получается:</b> ' + q.strong.join(", ") + '.</p>';
  if (q.weak.length) h += '<p><b>Потренируем:</b> ' + q.weak.join(", ") + '. Листик вернётся к этому в ближайшие дни.</p>';
  h += '<div class="row"><button class="btn" data-action="home">Выбрать упражнение</button></div></div></section></div>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
}
function renderDone() {
  if (TASKS[S.t].quiz) return renderQuizDone();
  const T = TASKS[S.t];
  const clean = new Set(), hard = new Set(), repeat = new Set();
  let firstTry = 0;
  T.steps.forEach((st, i) => {
    if (st.skip) return;
    const e = S.errors[i] || 0;
    if (e === 0 && !S.helped[i]) { firstTry++; clean.add(st.skill); }
    if (e > 0) hard.add(st.skill);
    if (e >= 2 || S.helped[i]) repeat.add(st.skill);
  });
  hard.forEach(x => clean.delete(x));
  const list = s => Array.from(s).join(", ");
  let h = lessonHeader(T, T.steps.length, true);
  h += '<div class="lesson"><section class="lcol">';
  h += '<div id="voiceslot">' + voiceHTML() + '</div>';
  h += '<div class="sum"><h2>Итог занятия</h2>';
  h += '<p>С первого раза получилось шагов: <b>' + firstTry + ' из ' + visIdx(T).length + '</b>.</p>';
  h += '<p><b>Получилось сам:</b> ' + (clean.size ? list(clean) : 'в этот раз всё давалось с трудом, и это нормально') + '.</p>';
  h += '<p><b>Было трудно:</b> ' + (hard.size ? list(hard) : 'ничего, шаги шли гладко') + '.</p>';
  h += '<p><b>Стоит повторить:</b> ' + (repeat.size ? list(repeat) : 'пока ничего, можно брать следующую задачу') + '.</p>';
  h += '<div class="row">' +
    (QPOS >= 0 && QPOS < QUEUE.length - 1
      ? '<button class="btn" data-action="start" data-i="' + QUEUE[QPOS + 1] + '">Следующая задача</button>'
      : (QPOS >= 0 ? '<a class="btn" href="' + (listHref() || 'start.html') + '" style="text-decoration:none;display:inline-flex;align-items:center">Раздел пройден. Выбрать другой</a>' : '<button class="btn" data-action="home">К списку задач</button>')) +
    (QPOS >= 0 ? '<button class="btn ghost" data-action="' + (listHref() ? 'list' : 'home') + '">К списку задач</button>' : '') +
    '<button class="btn ghost" data-action="start" data-i="' + S.t + '">Решить ещё раз</button></div></div></section>' + notebookAside(T, true) + '</div>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

/* ============================================================
   ЖИВОЙ ГОЛОС (дешёвая схема: браузер записывает речь ребёнка, сервер распознаёт её,
   текстовая модель отвечает, сервер озвучивает ответ; версия на Realtime: listik.realtime.html).
   Ребёнок говорит, Листик отвечает голосом. Правильность ответа,
   как и раньше, проверяет СЕРВЕР (/api/check): модель правильных
   ответов не знает, она получает от сервера только «верно / неверно»,
   правило и подсказку и пересказывает их ребёнку.
   ============================================================ */
const VOICE = {
  available: false, active: false, connecting: false, quiet: false, err: "",
  sid: null, ac: null, node: null, stream: null, player: null, playing: false, listening: false, vad: null,
  inFlight: false, queue: [], pending: null, adv: "none", advTimer: null, maxTimer: null, epoch: 0, pl: null, rd: null,
  state: "idle", heard: "", greeted: false
};
const VOICE_SILENCE = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA=";
const VOICE_WORKLET = "class Tap extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true;}}registerProcessor('tap',Tap);";
const VOICE_LABEL = { connecting: "Подключаюсь…", listen: "Слушаю тебя", think: "Листик думает…", speak: "Листик говорит" };
function plain(s) { return String(s == null ? "" : s).replace(/<[^>]*>/g, " ").replace(/&nbsp;/g, " ").replace(/\s+/g, " ").trim(); }

/* Знаки -> слова для озвучки: «7 · 4» читается как «7 умножить на 4» (модель сама знаки пропускает) */
// voiceMath:start
function voiceMath(s) {
  return String(s)
    .replace(/(?<=[\d)□])\s:\s(?=[\d(□])/g, " разделить на ")
    .replace(/(?<=[\d)□])\s*[−–]\s*(?=[\d(□])/g, " минус ")
    .replace(/(?<=[\d)□]) - (?=[\d(□])/g, " минус ")
    .replace(/\s*[·×*]\s*/g, " умножить на ")
    .replace(/\s*\+\s*/g, " плюс ")
    .replace(/\s*=\s*/g, " равно ")
    .replace(/\s*>\s*/g, " больше ").replace(/\s*<\s*/g, " меньше ")
    .replace(/\(/g, " открываем скобку ").replace(/\)/g, " закрываем скобку ")
    .replace(/□/g, " окошко ")
    .replace(/(?<=\s)\?(?=\s|$)/g, "какое-то число")
    .replace(/\bx\b/gi, " икс ")
    .replace(/ост\./g, "остаток")
    .replace(/\s+/g, " ").trim();
}
// voiceMath:end
function vsay(s) { return voiceMath(plain(s)); }

function voiceBtn() {
  if (!VOICE.available || VOICE.quiet) return "";
  const on = VOICE.active || VOICE.connecting;
  return '<button class="vbtn' + (on ? ' on' : '') + '" data-action="voicetoggle" aria-pressed="' + on + '" title="Листик читает вопросы вслух и слушает ответ">🎤 Голос</button>';
}
function voiceStatusHTML() {
  let h = "";
  if (VOICE.err) h += '<div class="vpill bad" role="alert">' + esc(VOICE.err) + '</div>';
  if (VOICE.active || VOICE.connecting) {
