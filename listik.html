    h += '<div class="vpill ' + VOICE.state + '" role="status"><span class="vdot"></span>' + label +
      (VOICE.heard ? ' · Я услышал: «' + esc(VOICE.heard) + '»' : '') + '</div>';
  } else if (VOICE.quiet && VOICE.available && S && (S.view === "task" || S.view === "done")) {
    h += '<div class="vpill quiet" role="status">🔇 ' + QUIET_NOTE + '</div>';
  }
  return h;
}

Object.assign(VOICE, {
  setState(state, heard) {
    if (state) this.state = state;
    if (heard !== undefined) this.heard = heard;
    paintVoice();
  },

  async start() {
    if (this.active || this.connecting) return;
    this.connecting = true; this.err = ""; this.state = "think"; this.heard = "";
    stopSpeech(); render();
    try {
      // проигрыватель «разблокируется» нажатием кнопки (иначе Safari и телефоны не дадут играть звук)
      this.player = new Audio(VOICE_SILENCE);
      this.player.play().catch(() => {});
      await this.openMic();
      const r = await api("/api/voice/session", {});
      if (r.status === 403 && r.data && r.data.error === "voice_limit") { this.teardown(); enterQuiet(); return; }
      if (r.status === 403 && r.data && r.data.error === "day_limit") { this.teardown(); USAGE.studyLeft = 0; endOfDay(); return; }
      if (r.status === 401) throw new Error("Чтобы говорить с Листиком голосом, войдите в кабинет родителя.");
      if (r.status === 429) throw new Error("Слишком много запусков голоса. Подожди немного.");
      if (r.status !== 200 || !r.data.sid) throw new Error("Голос сейчас недоступен. Можно отвечать кнопками.");
      this.sid = r.data.sid;
      this.fast = r.data.fast || null; if (this.fast) this.prefetch();
      this.active = true; this.connecting = false; this.state = "think";
      this.announce(); render();
    } catch (e) {
      const msg = e && e.name === "NotAllowedError" ? "Не получилось включить микрофон. Разреши доступ к нему в настройках браузера."
        : (e && e.message) || "Не получилось включить голос.";
      this.teardown(); this.err = msg; render();
    }
  },

  /* микрофон: звук кусочками, по паузе определяем, что ребёнок договорил */
  async openMic() {
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ac = new AC(); await this.ac.resume();
    await this.ac.audioWorklet.addModule(URL.createObjectURL(new Blob([VOICE_WORKLET], { type: "application/javascript" })));
    const src = this.ac.createMediaStreamSource(this.stream);
    this.node = new AudioWorkletNode(this.ac, "tap");
    this.node.port.onmessage = e => this.onChunk(e.data);
    const mute = this.ac.createGain(); mute.gain.value = 0;
    src.connect(this.node); this.node.connect(mute); mute.connect(this.ac.destination);
    this.vad = { thr: 0.02, calibMs: 0, calibSum: 0, calibN: 0, calibDone: false };
    this.resetVad();
  },
  resetVad() { Object.assign(this.vad, { pre: [], preSamples: 0, speaking: false, voicedMs: 0, silenceMs: 0, buf: [], totalMs: 0 }); },
  armMic() {
    if (!this.active || this.inFlight || this.playing || !this.vad) return;
    this.resetVad(); this.listening = true; this.setState("listen");
  },
  onChunk(f32) {
    const v = this.vad; if (!v || !this.ac) return;
    const sr = this.ac.sampleRate, ms = f32.length / sr * 1000;
    let sum = 0; for (let i = 0; i < f32.length; i++) sum += f32[i] * f32[i];
    const rms = Math.sqrt(sum / f32.length);
    // первые полсекунды слушаем фоновый шум и ставим порог чуть выше него
    if (!v.calibDone) {
      v.calibMs += ms; v.calibSum += rms; v.calibN++;
      if (v.calibMs >= 500) { v.thr = Math.min(0.08, Math.max(0.015, v.calibSum / v.calibN * 3 + 0.005)); v.calibDone = true; }
    }
    if (!this.listening) return;
    if (!v.speaking) {
      v.pre.push(f32); v.preSamples += f32.length;
      while (v.preSamples > sr * 0.3 && v.pre.length > 1) v.preSamples -= v.pre.shift().length;
      if (rms > v.thr) {
        v.voicedMs += ms;
        if (v.voicedMs >= 120) {
          v.speaking = true; v.buf = v.pre.slice(); v.pre = []; v.preSamples = 0; v.silenceMs = 0;
          v.totalMs = v.buf.reduce((a, c) => a + c.length, 0) / sr * 1000;
          this.setState("listen");
        }
      } else v.voicedMs = 0;
    } else {
      v.buf.push(f32); v.totalMs += ms;
      if (rms > v.thr) v.silenceMs = 0; else v.silenceMs += ms;
      // договорил: пауза больше 1,1 секунды или набралось 27 секунд (предел распознавания)
      if (v.silenceMs >= 1100 || v.totalMs >= 15000) {
        const speechMs = v.totalMs - v.silenceMs, chunks = v.buf;
        this.listening = false; this.resetVad();
        if (speechMs < 300) this.armMic(); else this.utterance(chunks);
      }
    }
  },
  utterance(chunks) {
    let total = 0; for (const c of chunks) total += c.length;
    const all = new Float32Array(total); let o = 0;
    for (const c of chunks) { all.set(c, o); o += c.length; }
    const ratio = this.ac.sampleRate / 16000, n = Math.floor(total / ratio), pcm = new Int16Array(n);
    for (let i = 0; i < n; i++) {   // звук -> 16 кГц, 16 бит, моно
      const a = Math.floor(i * ratio), b = Math.max(a + 1, Math.min(total, Math.floor((i + 1) * ratio)));
      let s = 0; for (let j = a; j < b; j++) s += all[j];
      const x = Math.max(-1, Math.min(1, s / (b - a)));
      pcm[i] = x < 0 ? x * 32768 : x * 32767;
    }
    const u8 = new Uint8Array(pcm.buffer); let bin = "";
    for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    this.exchange(this.withFast({ audio: btoa(bin) }));
  },

  teardown() {
    try { this.node && this.node.disconnect(); } catch (e) {}
    try { this.stream && this.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    try { this.ac && this.ac.close(); } catch (e) {}
    try { this.player && this.player.pause(); } catch (e) {}
    try { this.pl && this.pl.cancel(); } catch (e) {}
    try { this.rd && this.rd.cancel(); } catch (e) {}
    this.pl = this.rd = null;
    clearTimeout(this.advTimer); clearTimeout(this.maxTimer);
    this.sid = this.ac = this.node = this.stream = this.player = this.vad = null;
    this.active = false; this.connecting = false; this.inFlight = false; this.playing = false; this.listening = false;
    this.queue = []; this.pending = null; this.adv = "none"; this.state = "idle"; this.heard = ""; this.greeted = false;
    this.fast = null; this.fastTok = (this.fastTok || 0) + 1;
  },
  stop(msg, silent) {
    this.teardown(); this.err = msg || "";
    if (!silent) render();
  },

  /* Оборвать речь Листика: ребёнок перешёл на другой шаг, и старая реплика больше не нужна.
     Реплики, которые ещё в пути от сервера, помечаются устаревшими (epoch) и не озвучиваются. */
  interrupt() {
    this.epoch++;
    clearTimeout(this.advTimer); this.adv = "none";
    try { if (this.player) { this.player.onended = null; this.player.onerror = null; this.player.pause(); } } catch (e) {}
    try { if (this.pl) this.pl.cancel(); } catch (e) {}
    try { if (this.rd) this.rd.cancel(); } catch (e) {}     // обрываем поток с сервера: новые фразы не нужны
  },
  /* очередь фраз: играем по одной, по мере прихода с сервера; finished — когда всё проиграно (или оборвали) */
  makePlayback() {
    const V = this, q = []; let ended = false, playing = false, cancelled = false, started = false, over = false, resolveFin;
    const finished = new Promise(r => { resolveFin = r; });
    const fin = () => { if (over) return; over = true; if (V.pl === pb) V.pl = null; resolveFin(); };
    const next = () => {
      if (cancelled) return;
      if (!q.length) { playing = false; if (ended) fin(); return; }
      playing = true;
      const it = q.shift(), p = V.player; let called = false;
      const once = () => { if (called) return; called = true; next(); };
      if (!p) return once();
      p.onended = once; p.onerror = once;
      p.src = it.url || ("data:" + (it.mime || "audio/mpeg") + ";base64," + it.b64);
      p.play().catch(once);
    };
    const pb = {
      finished,
      get started() { return started; },
      push(mime, b64, url) {
        if (cancelled || (!b64 && !url)) return;
        q.push({ mime, b64, url });
        if (!started) { started = true; V.playing = true; V.setState("speak"); }
        if (!playing) next();
      },
      end() { ended = true; if (!playing && !q.length) fin(); },
      cancel() { cancelled = true; q.length = 0; if (V.pl === pb) V.playing = false; fin(); }
    };
    this.pl = pb;
    return pb;
  },
  /* один запрос «ход»: сервер присылает фразы по мере готовности (stream), браузер сразу начинает играть первую */
  async turn(payload, ep) {
    const pb = this.makePlayback();
    const res = await fetch("/api/voice/turn", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ session: SESSION, stream: true }, payload)) });
    const ct = res.headers.get("content-type") || "";
    const show = text => { if (ep === this.epoch && S) { vid = vid || ++voiceSeq; S.voice = { id: vid, text, loading: false }; paintVoice(); } };
    let vid = 0;
    if (res.status !== 200 || ct.indexOf("ndjson") < 0) {       // ошибка или прежний ответ одним куском
      const data = await res.json().catch(() => ({}));
      if (res.status === 200 && data.audio) pb.push(data.mime, data.audio);
      if (res.status === 200 && data.reply) show(data.reply);
      pb.end();
      return { status: res.status, data, pb };
    }
    const rd = res.body.getReader(); this.rd = rd;
    if (ep !== this.epoch) { try { rd.cancel(); } catch (e) {} }
    const dec = new TextDecoder(); let buf = "", err = null;
    const data = { heard: "", calls: null, reply: "" };
    const handle = o => {
      if (o.heard !== undefined) data.heard = o.heard;
      else if (o.calls) data.calls = o.calls;
      else if (o.error) err = o;
      else if (o.text !== undefined) {
        data.reply += (data.reply ? " " : "") + o.text; show(data.reply);
        if (o.audio) pb.push(o.mime, o.audio);
      }
    };
    try {
      for (;;) {
        const x = await rd.read(); if (x.done) break;
        buf += dec.decode(x.value, { stream: true });
        let i; while ((i = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
          if (line) { try { handle(JSON.parse(line)); } catch (e) {} }
        }
      }
    } catch (e) { if (ep === this.epoch) { pb.cancel(); throw e; } }
    if (this.rd === rd) this.rd = null;
    pb.end();
    if (err && !pb.started) return { status: 502, data: { error: err.error, stage: err.stage }, pb };
    return { status: 200, data, pb };
  },
  tell(t) { if (!this.active) return; this.queue.push(t); this.flush(); },
  flush() {
    if (!this.active || this.inFlight || this.playing || !this.queue.length) return;
    this.exchange({ tell: this.queue.splice(0) });
  },

  /* что происходит на экране -> сообщение для Листика */
  announce(retry) {
    if (!this.active) return;
    this.interrupt();
    if (this.fast && S.view === "task" && S.stage === "ask" && this.fastAsk(false)) return;
    if (S.view === "task" && S.stage === "lesson") this.tell(this.lessonText(retry));
    else if (S.view === "task" && S.stage === "ask") this.tell(this.stepText(retry));
    else if (S.view === "done") this.tell(this.doneText());
  },
  stepText(retry) {
    const T = TASKS[S.t], st = T.steps[S.s], n = visIdx(T).length;
    let t = (T.quiz ? "[Программа] Это быстрые вопросы (" + (T.quiz === "diag" ? "знакомство" : "разминка") + "), а не обычная задача." + (T.quiz === "diag" ? " Ничего не подсказывай и не объясняй: программа так узнаёт, что ребёнок уже умеет. Задавай вопросы по очереди." : "") : "[Программа] Задача №" + T.no + ". Условие: " + vsay(T.condition) + ".") + " Сейчас шаг " + vpos(T, S.s) + " из " + n + ". Вопрос (уже подготовлен для чтения вслух): " + vsay(st.q) + ". ";
    if (st.type === "choice") t += "Тип ответа: выбор варианта (передавай букву в поле choice). Варианты: " + st.options.map((o, i) => LETTERS[i] + ") " + vsay(o)).join("; ") + ". ";
    else if (st.type === "explain") t += "Тип ответа: ребёнок объясняет своими словами. Выслушай и передай его слова дословно в поле text. Сам ничего не объясняй и не подсказывай, ответ не называй. ";
    else if (st.type === "pair") t += "Тип ответа: " + st.fields.length + " числа по порядку (поле values): " + st.fields.map(f => vsay(f)).join(", ") + ". ";
    else t += "Тип ответа: одно целое число (поле number). ";
    if (retry === "ctx") t += "Этот вопрос ребёнку уже озвучен готовой записью, заново его не читай. Выслушай ребёнка и действуй по правилам.";
    else if (retry) t += "Взрослый помог, ребёнок пробует этот шаг ещё раз. Ободри его и повтори вопрос.";
    else if (!this.greeted) { this.greeted = true; t += "Это начало занятия: коротко поздоровайся (ты Листик), прочитай ребёнку вопрос вслух дословно и жди ответ голосом."; }
    else t += "Прочитай ребёнку вопрос вслух дословно и жди ответ голосом.";
    return t.replace(/([.?!])\./g, "$1");
  },
  lessonText(again) {
    const T = TASKS[S.t], L = T.lesson;
    let t = "[Программа] Мини-урок «" + vsay(L.title) + "». Прочитай ребёнку весь урок вслух дословно, подряд, одним рассказом, без пауз и без вопросов. Текст: " + L.cards.map(c => vsay(c.text)).join(" ") + " ";
    t += "Картинки на экране не описывай, ничего не добавляй от себя и не называй результатов, которых нет в тексте. Когда дочитаешь, скажи только: «Теперь нажми «Решать задачу»», и замолчи. Если ребёнок просит повторить, прочитай ещё раз дословно. ";
    if (!this.greeted) { this.greeted = true; t += "Это начало занятия: сначала коротко поздоровайся (ты Листик)."; }
    return t.replace(/([.?!])\./g, "$1");
  },
  doneText() {
    const T = TASKS[S.t];
    if (T.quiz) {
      const q = S.quizSum || { ok: 0, total: T.steps.length, weak: [], strong: [] };
      return "[Программа] " + (T.quiz === "diag" ? "Знакомство закончено" : "Разминка закончена") + ". Сразу получилось " + q.ok + " из " + q.total + ". Хорошо получается: " + (q.strong.length ? q.strong.join(", ") : "пока рано говорить") +
        ". Потренируем: " + (q.weak.length ? q.weak.join(", ") : "ничего") + ". Скажи в двух коротких предложениях, что получилось хорошо, и что Листик вернётся к трудному в ближайшие дни. Предложи выбрать упражнение. Не называй проценты.";
    }
    let first = 0; const hard = new Set();
    T.steps.forEach((st, i) => { const e = S.errors[i] || 0; if (e === 0 && !S.helped[i]) first++; if (e > 0) hard.add(plain(st.skill)); });
    return "[Программа] Задача решена. С первого раза получилось " + first + " из " + visIdx(T).length + ". Было трудно: " + (hard.size ? [...hard].join(", ") : "ничего") +
      ". Подведи итог в 2–3 коротких предложениях: что получилось само, что стоит повторить. Скажи, что можно нажать «Следующая задача» или сделать перерыв.";
  },

  /* один обмен с сервером: отправили, что случилось; получили вызов проверки или реплику */
  async exchange(first) {
    if (!this.active) return;
    this.inFlight = true; this.listening = false; this.setState("think");
    const sid = this.sid;
    let payload = first;
    try {
      for (let hop = 0; hop < 4; hop++) {
        if (this.queue.length) payload = Object.assign({}, payload, { tell: (payload.tell || []).concat(this.queue.splice(0)) });
        const ep = this.epoch;
        const r = await this.turn(Object.assign({ sid }, payload), ep);
        if (!this.active || this.sid !== sid) return;
        if (r.status === 403 && r.data && r.data.error === "voice_limit") { enterQuiet(); return; }
        if (r.status === 410) { this.stop("Занятие с голосом получилось слишком долгим. Нажми кнопку, чтобы начать заново."); return; }
        if (r.status !== 200) throw new Error("голос: ответ " + r.status + " " + JSON.stringify(r.data));
        const d = r.data;
        if (d.heard) this.setState(null, String(d.heard).trim().slice(0, 120));
        if (d.fast && d.intent === "repeat") {          // «повтори»: проигрываем вопрос ещё раз, модель не нужна
          if (ep !== this.epoch) { this.inFlight = false; this.setState("listen"); this.flush(); this.armMic(); return; }
          if (this.fastAsk(true)) return;
          payload = { tell: ["[Программа] Ребёнок просит повторить вопрос. Прочитай текущий вопрос ещё раз вслух."] };
          continue;
        }
        if (d.fast && d.calls && d.calls.length) {      // ответ понятен без модели: проверяем и играем готовую реплику
          this.lastInfo = null;
          let out = null;
          for (const c of d.calls) {
            if (ep !== this.epoch) { out = { error: "stale" }; break; }
            try { out = await this.exec(c); } catch (e) { console.error(e); out = { error: "внутренняя ошибка" }; }
          }
          if (!this.active || this.sid !== sid) return;
          if (ep !== this.epoch) { this.inFlight = false; this.setState("listen"); this.flush(); this.armMic(); return; }
          const info = this.lastInfo; this.lastInfo = null;
          if (this.adv === "queued") this.adv = "praising";
          const ids = out && !out.error && info ? this.sayFor(info) : null;
          if (ids && await this.fastSay(ids, ep)) return;
          this.inFlight = true;                         // запасной путь: пусть ответит модель
          payload = { tell: ["[Программа] Ребёнок ответил голосом. Результат проверки: " + JSON.stringify(out)] };
          continue;
        }
        if (d.calls && d.calls.length) {
          const outputs = [];
          for (const c of d.calls) {
            let out;
            if (ep !== this.epoch) out = { error: "шаг уже сменился, этот ответ относился к прошлому шагу" };
            else try { out = await this.exec(c); } catch (e) { console.error(e); out = { error: "внутренняя ошибка" }; }
            outputs.push({ call_id: c.call_id, output: JSON.stringify(out) });
          }
          if (!this.active || this.sid !== sid) return;
          if (this.adv === "queued") this.adv = "praising";
          payload = { outputs };
          continue;
        }
        if (this.err) { this.err = ""; paintVoice(); }
        this.inFlight = false;
        await this.playReply(d, ep, r.pb);
        return;
      }
      this.inFlight = false; this.armMic(); this.flush();
    } catch (e) {
      console.error("[голос]", e);
      this.inFlight = false;
      if (!this.active || this.sid !== sid) return;
      this.err = "С голосом что-то пошло не так. Скажи ещё раз или отвечай кнопками.";
      this.adv = "none"; paintVoice();
      this.armMic(); this.flush();
    }
  },
  async playReply(d, ep, pb) {
    const stale = () => ep !== undefined && ep !== this.epoch;
    if (stale()) {   // шаг сменился, пока шла реплика: молчим
      if (pb) pb.cancel();
      this.setState("listen"); this.flush(); this.armMic(); return;
    }
    if (pb && pb.started) {
      await pb.finished;
      if (this.pl === null || this.pl === pb) this.playing = false;
      if (!this.active) return;
      if (stale()) { this.setState("listen"); this.flush(); this.armMic(); return; }
    }
    this.setState("listen");
    this.maybeAdvance(false);      // похвалу дочитали: переходим к следующему шагу
    this.flush();                  // сообщения программы, пока мы говорили
    this.armMic();
  },

  async exec(c) {
    if (c.name !== "submit_answer") return { error: "неизвестная функция" };
    let args = {};
    try { args = JSON.parse(c.arguments || "{}"); } catch (e) { return { error: "не удалось прочитать ответ" }; }
    if (S.view !== "task" || S.stage !== "ask" || S.busy) return { error: "Сейчас ответ принять нельзя: шаг не ждёт ответа.", stage: S.stage || S.view };
    const st = TASKS[S.t].steps[S.s];
    let answer, picked;
    if (st.type === "explain") {
      const tx = String(args.text || "").trim().slice(0, 400);
      if (tx.length < 3) return { error: "Для этого шага нужны слова ребёнка в поле text." };
      answer = tx;
    } else if (st.type === "number") {
      if (!Number.isInteger(args.number)) return { error: "Для этого шага нужно одно целое число (поле number)." };
      answer = args.number;
    } else if (st.type === "choice") {
      const i = LETTERS.indexOf(String(args.choice || "").trim().toUpperCase());
      if (i < 0 || i >= st.options.length) return { error: "Для этого шага нужна буква варианта (поле choice): " + LETTERS.slice(0, st.options.length).join(", ") };
      answer = i; picked = i;
    } else {
      if (!Array.isArray(args.values) || args.values.length !== st.fields.length || !args.values.every(Number.isInteger))
        return { error: "Для этого шага нужно " + st.fields.length + " целых числа по порядку (поле values): " + st.fields.map(plain).join(", ") };
      answer = args.values;
    }
    return new Promise(resolve => {
      const p = { resolve: v => { clearTimeout(timer); resolve(v); } };
      const timer = setTimeout(() => { if (VOICE.pending === p) { VOICE.pending = null; resolve({ error: "проверка не ответила, попробуй ещё раз" }); } }, 10000);
      VOICE.pending = p;
      submit(answer, picked, "voice");
    });
  },

  /* результат проверки от сервера (вызывается из submit) */
  onResult(info) {
    if (!this.active) return;
    this.lastInfo = info;
    let out;
    if (info.kind === "correct") {
      this.adv = "queued";
      out = { result: "correct", message: vsay(info.ok), instruction: "Произнеси message дословно и добавь не больше пяти слов одобрения. Следующий вопрос не задавай: программа сама перейдёт к следующему шагу." };
    } else if (info.kind === "wrong") {
      out = { result: "wrong", attempt: info.attempts, max_attempts: 3, rule: vsay(info.rule), similar: info.similar ? vsay(info.similar) : null, locked: !!info.locked, tired: info.tired || null,
        instruction: info.locked
          ? "Скажи «Так бывает у всех. Можно сделать перерыв или позвать взрослого». Ничего не добавляй, ответ не называй."
          : "Скажи «Пока не так», дословно прочитай rule (и similar, если он есть) и попроси попробовать ещё раз. Ничего не добавляй от себя, ответ не называй и за ребёнка не считай." };
    } else if (info.kind === "moveon") {
      this.adv = "queued";
      out = { result: "move_on", instruction: "Скажи «Хорошо, идём дальше» или «Ничего страшного, идём дальше» и больше ничего. Ответ не называй и не объясняй. Программа сама перейдёт к следующему вопросу." };
    } else if (info.kind === "locked") {
      out = { result: "locked", locked: true, rule: vsay(info.rule), instruction: "Шаг заблокирован. Скажи «Так бывает у всех. Можно сделать перерыв или позвать взрослого». Ответ не называй." };
    } else out = { error: info.msg || "ошибка" };
    if (info.kind === "wrong" && info.tired && out.instruction && !out.locked)
      out.instruction += info.tired === "break"
        ? " Потом добавь одну добрую фразу: ты молодец, что стараешься, и можно сделать перерыв или выбрать задачу полегче."
        : " Потом добавь одну добрую фразу: ты стараешься, и так бывает у всех. Говори спокойно и коротко.";
    if (this.pending) { const p = this.pending; this.pending = null; p.resolve(out); }
    else {
      const msg = "[Программа] Ребёнок ответил на экране (кнопками). Результат проверки: " + JSON.stringify(out);
      const ids = this.fast && info.kind !== "error" ? this.sayFor(info) : null;
      if (ids) this.fastSay(ids, this.epoch).then(ok => { if (!ok) this.tell(msg); });
      else this.tell(msg);
    }
  },
  maybeAdvance(force) {
    if (this.adv !== "praising") return;
    if (this.inFlight && !force) return;
    this.adv = "none"; clearTimeout(this.advTimer);
    if (S.view === "task" && S.stage === "right") nextStep();
  }
});

/* ---------- быстрый голос: готовые записи вместо «модель + озвучка» ----------
   Вопрос шага, «верно», правило и подсказки под типичные ошибки написаны учителями и озвучены заранее (mp3 на сервере).
   Ответ ребёнка сервер разбирает без модели (fastparse.js); если не уверен, отвечает модель, как раньше.
   Если запись не загрузилась, тоже работает прежний путь. Выключатель на сервере: VOICE_FAST=0. */
Object.assign(VOICE, {
  fast: null, fastTok: 0, lastInfo: null, clipBlobs: new Map(), lastPick: {},
  loadClip(id) {                       // -> Promise<адрес для проигрывателя | null>; повторные просьбы берут из памяти
    if (!id) return Promise.resolve(null);
    let p = this.clipBlobs.get(id);
    if (!p) {
      p = fetch("/clips/" + id + ".mp3").then(r => r.ok ? r.blob() : Promise.reject(new Error("clip " + r.status)))
        .then(b => URL.createObjectURL(b)).catch(() => { this.clipBlobs.delete(id); return null; });
      this.clipBlobs.set(id, p);
    }
    return p;
  },
  prefetch() {                         // заранее качаем общие фразы и вопросы текущей задачи (ответы и подсказки не качаем: в них есть решение)
    if (!this.fast) return;
    const ids = [];
    Object.values(this.fast.clips || {}).forEach(a => (a || []).forEach(id => ids.push(id)));
    try { TASKS[S.t].steps.forEach(st => { if (st.qc) ids.push(st.qc); }); } catch (e) {}
    ids.forEach(id => this.loadClip(id));
  },
  pickClip(key) {                      // случайный вариант фразы, но не тот же, что в прошлый раз
    const a = (this.fast && this.fast.clips && this.fast.clips[key]) || [];
    if (!a.length) return null;
    let id = a[Math.floor(Math.random() * a.length)];
    if (a.length > 1 && id === this.lastPick[key]) id = a[(a.indexOf(id) + 1) % a.length];
    this.lastPick[key] = id; return id;
  },
  /* что сказать после проверки ответа (номера клипов); null — готовой записи нет, пусть говорит модель */
  sayFor(info) {
    const say = (info.say || []).filter(Boolean);
    if (info.kind === "correct") return say.length ? say : null;
    if (info.kind === "moveon") { const m = this.pickClip("moveon"); return m ? [m] : null; }
    if (info.kind === "locked") { const m = this.pickClip("locked"); return m ? [m] : null; }
    if (info.kind === "wrong") {
      if (info.locked) { const m = this.pickClip("locked"); return m ? [m] : null; }
      const lead = this.pickClip("lead_wrong");
      if (!say.length || !lead) return null;
      const ids = [lead, ...say];
      if (info.tired) { const t = this.pickClip(info.tired === "break" ? "tired_break" : "tired_ease"); if (t) ids.push(t); }
      return ids;
    }
    return null;
  },
  /* сложить записи в очередь проигрывателя; все грузятся параллельно, играть начинаем с первой готовой */
  async playClips(ids, ep) {
    const loads = ids.map(id => this.loadClip(id));
    const pb = this.makePlayback(); let ok = false;
    for (const l of loads) {
      const u = await l;
      if (ep !== this.epoch || !this.active) { pb.cancel(); return { ok: false, stale: true }; }
      if (u) { pb.push("audio/mpeg", null, u); ok = true; }
      else if (!ok) { pb.cancel(); return { ok: false }; }   // первой записи нет: играть нечего, отдаём модели
    }
    pb.end();
    return { ok: true, pb };
  },
  /* сказать записями и вернуться к слушанию; false — не получилось, надо делать по-старому */
  async fastSay(ids, ep) {
    const my = this.fastTok = (this.fastTok || 0) + 1;
    this.inFlight = true; this.setState("think");
    let r; try { r = await this.playClips(ids, ep); } catch (e) { r = { ok: false }; }
    if (!this.active) return true;
    if (this.fastTok !== my) { if (r.pb) r.pb.cancel(); return true; }      // уже началось другое: оно само всё доведёт
    if (r.stale || ep !== this.epoch) { if (r.pb) r.pb.cancel(); this.inFlight = false; this.setState("listen"); this.flush(); this.armMic(); return true; }
    if (!r.ok) { this.inFlight = false; return false; }
    this.inFlight = false;
    await this.playReply({}, ep, r.pb);
    return true;
  },
  /* вопрос текущего шага из записи (в первый раз с приветствием). true — взялись, false — записи нет */
  fastAsk(again) {
    const st = TASKS[S.t].steps[S.s];
    if (!this.fast || !st || !st.qc) return false;
    const ids = [];
    if (!this.greeted && !again) { this.greeted = true; const g = this.pickClip("greet"); if (g) ids.push(g); }
    ids.push(st.qc);
    this.prefetch();
    this.fastSay(ids, this.epoch).then(ok => { if (!ok) { this.greeted = this.greeted; this.tell(this.stepText(false)); } });
    return true;
  },
  /* что ждём от ребёнка на этом шаге: по этому сервер разбирает речь без модели */
  fastSpec() {
    if (!this.fast || !S || S.view !== "task" || S.stage !== "ask") return null;
    const st = TASKS[S.t].steps[S.s];
    if (!st) return null;
    if (st.type === "number") return { type: "number" };
    if (st.type === "pair" && st.fields) return { type: "pair", n: st.fields.length };
    if (st.type === "choice" && st.options) return { type: "choice", options: st.options.map(o => plain(o)) };
    return null;
  },
  withFast(p) {
    const spec = this.fastSpec();
    if (spec) { p.fast = spec; p.tell = [this.stepText("ctx")]; }     // контекст для модели на случай, если разбор не уверен
    return p;
  }
});

/* ---------- связь с сервером ---------- */
const DATA_DIR = "data/public/";
function randomId() {
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  return Array.from(a, x => x.toString(16).padStart(2, "0")).join("");
}
const SESSION = randomId();
async function loadJSON(name) {
  const res = await fetch(DATA_DIR + name, { cache: "no-cache" });
  if (!res.ok) throw new Error(name + ": " + res.status);
  return res.json();
}
async function api(path, payload) {
  const res = payload
    ? await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({ session: SESSION }, payload)) })
    : await fetch(path, { cache: "no-cache" });
  const data = await res.json().catch(() => ({}));
  return { status: res.status, data };
}
/* ---- время занятий: до 70 минут в день, голос до 30 минут; считает сервер ---- */
const USAGE = { studyLeft: null, voiceLeft: null, studyMax: 4200, voiceMax: 1800, lastInput: Date.now() };

/* две полоски в шапке урока: сколько времени занятия и голоса уже использовано; текст — сколько осталось */
function meterHTML(icon, label, left, max, off) {
  const pct = max > 0 ? Math.max(0, Math.min(100, Math.round((max - left) / max * 100))) : 100;
  const mins = Math.max(left > 0 ? 1 : 0, Math.ceil(left / 60));
  const warn = !off && left <= 300;
  return '<div class="meter' + (warn ? ' warn' : '') + (off ? ' off' : '') + '" role="progressbar" aria-label="' + label + '" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '">' +
    '<span class="mi" aria-hidden="true">' + icon + '</span><span class="mbar"><i style="width:' + pct + '%"></i></span><span class="mtx">' + mins + ' мин</span></div>';
}
function limHTML() {
  if (USAGE.studyLeft == null) return "";
  return meterHTML("⏱", "Время занятия сегодня, осталось", USAGE.studyLeft, USAGE.studyMax, false);
}
function setUsage(d) {
  if (!d || typeof d.studyLeft !== "number") return;
  USAGE.studyLeft = d.studyLeft; USAGE.voiceLeft = d.voiceLeft; USAGE.studyMax = d.studyMax; USAGE.voiceMax = d.voiceMax;
  if (USAGE.voiceLeft <= 0 && VOICE.available && !VOICE.quiet) enterQuiet();
  if (USAGE.studyLeft <= 0 && S && (S.view === "task" || S.view === "done")) return endOfDay();
  const el = document.getElementById("limbox"); if (el) el.innerHTML = limHTML();
}
function enterQuiet() {
  VOICE.quiet = true; VOICE.err = "";
  if (VOICE.active || VOICE.connecting) VOICE.stop(null, true);
  stopSpeech();
  if (S && (S.view === "task" || S.view === "done")) render();
}
function endOfDay() {
  VOICE.stop(null, true); stopSpeech();
  S = { view: "rest" }; render();
}

async function usageSend(active, voice) {
  try { const r = await api("/api/usage/ping", { active, voice, task: (S && S.t != null && TASKS[S.t]) ? TASKS[S.t].id : null }); if (r.status === 200) setUsage(r.data); } catch (e) {}
}
function usageTick() {
  const lesson = !!S && (S.view === "task" || S.view === "done");
  const vis = document.visibilityState === "visible";
  if (!lesson && !VOICE.active) return;
  const idle = Date.now() - USAGE.lastInput > 180000;   // 3 минуты без нажатий: ребёнок отошёл, время занятия не идёт
  usageSend(lesson && vis && (!idle || VOICE.active), vis && VOICE.active);
}
["pointerdown", "keydown", "touchstart"].forEach(ev => addEventListener(ev, () => { USAGE.lastInput = Date.now(); }, { passive: true }));

async function reloadTasks() {
  try { const t = await api("/api/tasks"); if (t.status === 200 && Array.isArray(t.data.tasks) && t.data.tasks.length === TASKS.filter(x => !x.quiz).length) TASKS = t.data.tasks; } catch (e) {}
  await loadOffer();
}
async function loadData() {
  const [tasks, phrases, prompts] = await Promise.all([api("/api/tasks"), loadJSON("phrases.json"), loadJSON("prompts.json")]);
  if (tasks.status !== 200) throw new Error("tasks");
  TASKS = tasks.data.tasks;
  SECTIONS = tasks.data.sections || [];
  CANNED = phrases.canned;
  SITUATION = phrases.situation;
  PROMPT_TEMPLATE = prompts.ai_voice.template;
  BANNED = new RegExp(prompts.ai_voice.banned_pattern, prompts.ai_voice.banned_flags);
  try { const me = await api("/api/me"); USER = me.data.user || null; } catch (e) { USER = null; }
  await loadOffer();
  try { const v = await api("/api/voice/available"); VOICE.available = !!(v.data && v.data.ok) && !!((window.AudioContext || window.webkitAudioContext) && window.AudioWorkletNode && navigator.mediaDevices && navigator.mediaDevices.getUserMedia); } catch (e) { VOICE.available = false; }
  try { const u = await api("/api/usage"); setUsage(u.data); } catch (e) {}
}

      S = USER ? { view: "pin" } : { view: "auth", mode: "login", err: "" };
      return render();
    }
    buildQueue();
    if (QUEUE) {
      const want = PARAMS.get("task"), k = want ? TASKS.findIndex(t => t.id === want) : -1;
      return startTask(k >= 0 && QUEUE.indexOf(k) >= 0 ? k : QUEUE[0]);
    }
    S = { view: "home" };
    render();
  } catch (e) {
    app.innerHTML = '<div class="top"><div class="brand hand">' + LOGO + 'Листик</div></div>' +
      '<p class="lead">Не получилось загрузить задачи. Проверьте интернет и обновите страницу. ' +

}
