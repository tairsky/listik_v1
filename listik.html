<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Листик — репетитор по математике</title>
<style>
@font-face { font-family: "Manrope"; src: url("fonts/Manrope-cyrillic-ext.woff2") format("woff2"); font-weight: 200 800; font-display: swap; unicode-range: U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F; }
@font-face { font-family: "Manrope"; src: url("fonts/Manrope-cyrillic.woff2") format("woff2"); font-weight: 200 800; font-display: swap; unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116; }
@font-face { font-family: "Manrope"; src: url("fonts/Manrope-latin.woff2") format("woff2"); font-weight: 200 800; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
@font-face { font-family: "Onest"; src: url("fonts/Onest.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Caveat"; src: url("fonts/Caveat.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
  :root {
    --paper: #FBFAF4;
    --grid: rgba(27,36,64,.055);
    --ink: #1E2A22;
    --pen: #2B4BC4;
    --red: #C2620A;
    --green: #1F7A45;
    --green-d: #17653A;
    --tint: #E5F3E9;
    --sun: #F2C14E;
    --text: #1E2A22;
    --muted: #4B5575;
    --card: #FFFFFF;
    --line: #DDE3D6;
    --ok-bg: #E5F3E9;
    --bad-bg: #FFF0DB;
    --mark-bg: #E5F3E9;
    --btn-text: #FFFFFF;
    --head:"Manrope","Onest",system-ui,sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    background-position: -1px -1px;
    color: var(--text);
    font-family:"Manrope","Onest",system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    min-height: 100vh;
  }
  body::before {
    content: ""; position: fixed; top: 0; bottom: 0; left: 14px; width: 2px;
    background: var(--red); opacity: .55; pointer-events: none;
  }
  .sheet { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px 32px; }
  @media (min-width: 700px) {
    body::before { left: calc(50% - 320px + 14px); }
    .sheet { padding-left: 34px; }
  }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 32px; color: var(--ink); line-height: 1; }
  .brand svg { width: 34px; height: 34px; }
  .back {
    font: inherit; font-size: 16px; font-weight: 700; background: none; border: 0; color: var(--ink);
    padding: 10px 6px; min-height: 44px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
  }
  h1, h2 { margin: 0; line-height: 1.2; }
  .lead { font-size: 20px; margin: 0 0 22px; max-width: 34ch; }

  .tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .task-btn {
    width: 100%; text-align: left; font: inherit; color: var(--text);
    background: var(--card); border: 2px solid var(--ink); border-radius: 4px 14px 4px 14px;
    padding: 14px 16px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: baseline;
  }
  .task-btn:hover { background: var(--mark-bg); }
  .task-no { font-size: 30px; color: var(--ink); grid-row: span 2; }
  .task-title { font-weight: 800; }
  .task-cond { font-size: 16px; color: var(--muted); }

  .condition { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .condition .no { font-size: 15px; color: var(--muted); font-weight: 700; }
  .condition .txt { font-size: 28px; color: var(--ink); line-height: 1.3; margin-top: 2px; }
  .condition .txt.long { font-size: 24px; }

  .notebook { margin: 0 0 16px; min-height: 8px; }
  .nline { font-size: 24px; color: var(--ink); line-height: 1.35; padding-left: 6px; border-left: 3px solid var(--ink); margin-bottom: 4px; }

  .dots { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); background: transparent; }
  .dot.done { background: var(--ink); }
  .dot.cur { background: var(--mark-bg); box-shadow: 0 0 0 3px var(--mark-bg); }

  .step { background: var(--card); border: 2px solid var(--ink); border-radius: 14px 4px 14px 4px; padding: 16px; }
  .step .meta { font-size: 15px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .q { font-size: 21px; font-weight: 700; line-height: 1.4; margin: 0 0 14px; }

  /* голос Листика */
  .voice { display: flex; gap: 10px; align-items: flex-end; margin: 0 0 14px; }
  .voice svg { width: 38px; height: 38px; flex: none; }
  .bubble {
    background: var(--paper); border: 2px solid var(--ink); border-radius: 14px 14px 14px 2px;
    padding: 8px 14px; font-size: 17px; line-height: 1.4; min-height: 42px; display: flex; align-items: center;
  }
  .dots3 { display: inline-flex; gap: 5px; }
  .dots3 i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); opacity: .35; animation: bob 1s infinite; }
  .dots3 i:nth-child(2) { animation-delay: .15s; }
  .dots3 i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .opts { display: grid; gap: 10px; }
  .opt {
    font: inherit; font-weight: 700; text-align: left; color: var(--text);
    background: var(--paper); border: 2px solid var(--line); border-radius: 10px;
    padding: 12px 14px; min-height: 56px; cursor: pointer; touch-action: manipulation;
  }
  .opt:hover:not(:disabled) { border-color: var(--ink); background: var(--mark-bg); }
  .opt.wrong { border-color: var(--red); background: var(--bad-bg); text-decoration: line-through; cursor: default; }

  /* поля ответа и клавиатура */
  .fields { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
  .field { display: grid; gap: 4px; font-weight: 700; font-size: 16px; }
  .disp {
    font: inherit; font-size: 34px; font-weight: 800; color: var(--ink); text-align: center;
    min-width: 120px; height: 64px; padding: 0 16px; background: var(--paper);
    border: 3px solid var(--line); border-radius: 12px; cursor: pointer; touch-action: manipulation;
  }
  .disp.active { border-color: var(--ink); background: var(--mark-bg); }
  .disp.active .val::after { content: ""; display: inline-block; height: 1em; border-right: 3px solid var(--ink); margin-left: 2px; vertical-align: -0.12em; animation: blink 1s steps(1) infinite; }
  .disp .ph { color: var(--muted); opacity: .6; }
  @keyframes blink { 50% { opacity: 0; } }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 340px; margin-top: 14px; user-select: none; -webkit-user-select: none; }
  .key {
    font: inherit; font-size: 28px; font-weight: 800; color: var(--text);
    background: var(--paper); border: 2px solid var(--line); border-radius: 12px;
    height: 62px; cursor: pointer; touch-action: manipulation;
  }
  .key:active { background: var(--mark-bg); border-color: var(--ink); }
  .key.go { background: var(--ink); border-color: var(--ink); color: var(--btn-text); font-size: 16px; }
  .key.erase { font-size: 24px; }

  input.num {
    font: inherit; font-size: 26px; font-weight: 800; color: var(--ink);
    width: 132px; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper);
  }
  input.inp {
    font: inherit; font-size: 18px; color: var(--text); width: 100%; max-width: 360px;
    padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: var(--card);
  }
  input.pin { font-size: 26px; font-weight: 800; letter-spacing: 8px; width: 150px; text-align: center; color: var(--ink); border-color: var(--ink); }
  .form label { display: grid; gap: 4px; font-weight: 700; font-size: 16px; margin-bottom: 12px; }
  .form .hint { font-weight: 400; font-size: 14px; color: var(--muted); max-width: 46ch; }
  .form .chk { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 15px; }
  .form .chk input { width: 22px; height: 22px; margin-top: 2px; flex: none; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tabs .btn { min-height: 44px; padding: 6px 16px; font-size: 16px; }
  .tabs .btn.on { background: var(--ink); color: var(--btn-text); }
  .bar { height: 10px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 8px 0 16px; }
  .stat { border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--card); }
  .stat b { display: block; font-size: 26px; color: var(--ink); line-height: 1.2; }
  .stat span { font-size: 14px; color: var(--muted); }
  .cabinfo { display: grid; gap: 4px; }
  .rowitem { border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--card); margin-bottom: 10px; }
  .rowitem .top2 { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-weight: 700; margin-bottom: 6px; }
  .rowitem .sub { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .tag { display: inline-block; font-size: 14px; font-weight: 700; border-radius: 8px; padding: 2px 8px; border: 2px solid var(--line); }
  .tag.good { border-color: var(--green); color: var(--green); }
  .tag.train { border-color: var(--ink); color: var(--ink); }
  .tag.repeat { border-color: var(--red); color: var(--red); }
  h2.sec { font-size: 22px; margin: 26px 0 10px; }
  input.inp:focus-visible, input.pin:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  input.num:focus-visible, .btn:focus-visible, .opt:focus-visible, .task-btn:focus-visible, .back:focus-visible,
  .key:focus-visible, .disp:focus-visible {
    outline: 3px solid var(--red); outline-offset: 2px;
  }

  .btn {
    font: inherit; font-weight: 800; font-size: 18px;
    background: var(--ink); color: var(--btn-text); border: 2px solid var(--ink);
    border-radius: 10px; padding: 10px 20px; min-height: 48px; cursor: pointer;
  }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn.small { font-size: 15px; min-height: 40px; padding: 6px 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }

  .fb { border-radius: 10px; padding: 12px 14px; margin-top: 12px; font-size: 18px; }
  .fb.ok { background: var(--ok-bg); border: 2px solid var(--green); }
  .fb.bad { background: var(--bad-bg); border: 2px solid var(--red); }
  .fb strong.g { color: var(--green); }
  .fb strong.r { color: var(--red); }
  .mark { background: var(--mark-bg); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
  .mark b { font-weight: 800; }
  .pop { animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.96); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    .pop, .dots3 i, .disp.active .val::after { animation: none; }
    .dots3 i { opacity: .8; }
  }

  .sum { background: var(--card); border: 2px solid var(--ink); border-radius: 14px 4px 14px 4px; padding: 18px; }
  .sum h2 { font-size: 26px; color: var(--ink); margin-bottom: 10px; }
  .sum p { margin: 0 0 10px; }
  .foot { margin-top: 28px; font-size: 14px; color: var(--muted); max-width: 52ch; }
  .foot p { margin: 0 0 8px; }
  .top { flex-wrap: wrap; }
  .tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .snd, .speak {
    font: inherit; font-size: 15px; font-weight: 700; background: transparent; color: var(--ink);
    border: 2px solid var(--line); border-radius: 10px; padding: 4px 12px; min-height: 40px; cursor: pointer; touch-action: manipulation;
  }
  .snd:hover, .speak:hover { border-color: var(--ink); background: var(--mark-bg); }
  .snd:focus-visible, .speak:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .meta-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .meta-row .meta { margin: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .qline { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0 0 14px; }
  .qline a { color: var(--green); }

  /* ===== Дизайн «Тетрадь» (из Claude Design) ===== */
  body { background-size: 28px 28px; background-position: 0 0; background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px), linear-gradient(to bottom, var(--grid) 1px, transparent 1px); }
  body.plain { background-image: none; }
  body::before { display: none; }
  .sheet { max-width: 820px; margin: 0 auto; padding: 24px 24px 72px; }
  .sheet.wide { max-width: 1120px; }
  @media (min-width: 700px) { .sheet { padding-left: 24px; } }
  .hand { font-family: "Caveat", "Segoe Script", cursive; font-weight: 600; }
  h1,h2 { font-family:var(--head); font-weight:800; letter-spacing:-0.025em; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--pen) !important; outline-offset: 3px !important; }

  .top { margin-bottom: 28px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--head); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; color: var(--ink); text-decoration: none; line-height: 1; }
  .brand svg { width: 36px; height: 36px; }
  .back, .snd, .speak {
    display: inline-flex; align-items: center; gap: 10px; font: inherit; font-size: 16px; font-weight: 600; color: var(--ink);
    background: #fff; border: 2px solid var(--line); border-radius: 14px; min-height: 48px; padding: 0 18px 0 14px; cursor: pointer; text-decoration: none;
    transition: background .15s ease;
  }
  .snd { padding: 0 18px; }
  .speak { min-height: 40px; padding: 0 14px; font-size: 15px; }
  .back:hover, .snd:hover, .speak:hover { background: var(--tint); border-color: var(--line); }
  .back svg, .snd svg { flex: none; }
  .lead { max-width: none; }

  .say { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 32px; }
  .say > svg { width: 56px; height: 56px; flex: none; }
  .say .bb { background: #fff; border: 1.5px solid var(--line); border-radius: 8px 24px 24px 24px; padding: 20px 24px; box-shadow: 0 16px 32px -24px rgba(27,36,64,.3); }
  .say .bb p { margin: 0; font-size: 22px; line-height: 1.5; font-weight: 500; }
  .hl { background: linear-gradient(transparent 62%, var(--sun) 62%); font-weight: 600; }

  .tasks { grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 18px; }
  .task-btn {
    display: flex; flex-direction: column; gap: 18px; padding: 22px 24px 26px; background: #fff; color: var(--ink);
    border: 2px solid var(--line); border-radius: 24px; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .task-btn:hover { background: #fff; transform: translateY(-3px); border-color: var(--green); box-shadow: 0 22px 40px -26px rgba(27,36,64,.4); }
  .tb-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .tb-left { display: flex; align-items: center; gap: 12px; }
  .task-no { display: inline-flex; align-items: center; height: 44px; padding: 0 16px; background: var(--tint); color: var(--green); border-radius: 14px; font-size: 28px; line-height: 1; grid-row: auto; }
  .task-btn.word .task-no { background: #FFF1C2; color: var(--ink); }
  .task-title { font-size: 15px; font-weight: 600; color: var(--muted); }
  .task-cond { font-size: 26px; font-weight: 500; letter-spacing: .01em; color: var(--ink); line-height: 1.3; }
  .task-btn.word .task-cond { font-size: 20px; line-height: 1.45; }

  /* урок: слева Листик, справа тетрадь */
  .lhead { align-items: center; }
  .lprog { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
  .lno { font-size: 28px; color: var(--green); line-height: 1; }
  .pills { display: flex; gap: 6px; }
  .pills span { width: 34px; height: 10px; border-radius: 999px; background: #E4E8DD; }
  .pills span.done { background: var(--green); }
  .pills span.cur { background: var(--sun); box-shadow: 0 0 0 2px var(--ink); }
  .lstep { font-size: 15px; font-weight: 600; color: var(--muted); }
  .lvis { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 14px; }
  .lg { display: grid; gap: 5px; padding: 8px; border: 2px solid var(--ink); border-radius: 12px; background: var(--paper); }
  .ld { width: 13px; height: 13px; border-radius: 50%; background: var(--green); display: block; }
  .ld.b { background: var(--sun); box-shadow: 0 0 0 1.5px var(--ink); }
  .lpage { max-width: 760px; margin: 0 auto; }
  .lhd { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 18px 0 8px; }
  .ltitle { margin: 0; font-size: 26px; }
  .lscene { display: flex; gap: 16px; align-items: flex-start; background: #fff; border: 1.5px solid #E4E8DD; border-radius: 22px; padding: 20px 22px; margin: 14px 0; box-shadow: 0 6px 20px rgba(30,60,40,.06); }
  .lnum { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--green); color: #fff; font-weight: 800; display: grid; place-items: center; }
  .lbody { flex: 1; min-width: 0; }
  .limg { display: block; width: 100%; max-width: 560px; height: auto; border-radius: 16px; margin: 6px 0 0; }
  .lgo { margin: 22px 0 40px; }
  .q.lq { font-weight: 600; font-size: 22px; line-height: 1.5; }
  .lesson { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr)); gap: 40px; align-items: start; }
  .lcol { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .voice { display: flex; align-items: flex-start; gap: 16px; margin: 0; }
  .voice svg { width: 56px; height: 56px; flex: none; }
  .bubble { background: #fff; border: 1.5px solid var(--line); border-radius: 8px 24px 24px 24px; padding: 18px 24px; font-size: 21px; line-height: 1.5; font-weight: 500; min-height: 62px; box-shadow: 0 16px 32px -24px rgba(27,36,64,.3); }
  .step { background: #fff; border: 1px solid var(--line); border-radius: 28px; padding: 24px; box-shadow: 0 28px 56px -28px rgba(27,36,64,.25); }
  .step .meta { font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .q { font-size: 22px; font-weight: 600; line-height: 1.45; }
  .opts { gap: 12px; }
  .opt { display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 10px 20px 10px 12px; font-size: 20px; font-weight: 600; background: #fff; border: 2px solid #D3DDE4; border-radius: 18px; transition: transform .15s ease, border-color .15s ease, background .15s ease; }
  .opt:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--green); background: #fff; }
  .opt .let { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: none; border-radius: 12px; background: #fff; border: 2px solid #D3DDE4; font-size: 26px; line-height: 1; }
  .opt.wrong { background: var(--bad-bg); border-color: var(--red); text-decoration: none; opacity: .75; }
  .opt.wrong .let { border-color: var(--red); }

  .fb { border-radius: 18px; padding: 14px 18px; font-size: 18px; }
  .fb.ok { background: var(--ok-bg); border: 2px solid var(--green); }
  .fb.bad { background: var(--bad-bg); border: 2px solid var(--red); }
  .fb strong.r { color: var(--red); }
  .mark { background: var(--mark-bg); border: 2px solid #BFE6CE; border-radius: 18px; padding: 14px 18px; font-size: 18px; }
  .mark b { font-weight: 700; }
  .disp { border-radius: 16px; border: 3px solid var(--line); background: #fff; color: var(--ink); }
  .disp.active { border-color: var(--green); background: var(--tint); }
  .disp.active .val::after { border-right-color: var(--green); }
  .key { border-radius: 16px; background: #fff; border-color: var(--line); height: 64px; }
  .key:active { background: var(--tint); border-color: var(--green); }
  .key.go { background: var(--green); border-color: var(--green); color: #fff; }
  input.num, input.inp { border-radius: 14px; border-color: var(--line); background: #fff; }
  input.pin { border-color: var(--green); color: var(--ink); }

<script>
/* ============================================================
   БАНК ЗАДАЧ. Браузер получает от сервера только условия и варианты (GET /api/tasks).
   Ответы, правила и фразы «верно» хранятся на сервере и приходят после проверки.
   Правильность ответа проверяет сервер, не нейросеть.
   Типы шагов:
     choice — выбор из вариантов (correct — номер верного, с нуля)
     number — одно число (answer)
     pair   — два числа по порядку полей (fields, answer)
   q — вопрос, rule — правило при ошибке, ok — фраза при верном ответе,
   note — строка в тетрадь, skill — тема шага (единственное, что знает ИИ).
   ============================================================ */
let TASKS = [];        // с сервера, без ответов
let USER = null;       // вошедший кабинет: { email, child, parent } или null

/* ============================================================
   ГОЛОС ЛИСТИКА.
   ИИ здесь только подбадривает. Он НЕ проверяет ответы, НЕ видит
   вопросов, ответов и того, что набрал ребёнок. Ему передаётся
   лишь тип события («ребёнок ошибся второй раз») и название темы.
   Ответ ИИ проходит проверку; если что-то не так или ИИ недоступен,
   показывается заготовленная фраза.
   ============================================================ */
let CANNED = {};     // из data/public/phrases.json
let SITUATION = {};  // из data/public/phrases.json

let BANNED = /(?!)/;   // из data/prompts.json (до загрузки ничего не совпадает)
let PROMPT_TEMPLATE = "";  // из data/prompts.json

function cleanVoice(t) {
  if (typeof t !== "string") return null;
  t = t.trim().replace(/^["«“]+|["»”]+$/g, "").trim();
  if (t.length < 8 || t.length > 220) return null;
  if (/\d/.test(t)) return null;
  if (/\?/.test(t)) return null;
  if (/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/u.test(t)) return null;
  if (BANNED.test(t)) return null;
  if (!/[а-яё]/i.test(t)) return null;
  return t;
}

let SAMPLE = null;
let SAMPLE_STATE = "pending";   // pending | ok | none
const AI = { on: true, denied: false };
let voiceSeq = 0;
const lastPick = {};

if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("sample").then(fn => {
    SAMPLE = fn || null;
    SAMPLE_STATE = fn ? "ok" : "none";
    if (S && S.view === "home") render();
  }).catch(() => { SAMPLE_STATE = "none"; if (S && S.view === "home") render(); });
} else {
  SAMPLE_STATE = "none";
}

function pickCanned(ev) {
  const arr = CANNED[ev];
  let i = Math.floor(Math.random() * arr.length);
  if (arr.length > 1 && i === lastPick[ev]) i = (i + 1) % arr.length;
  lastPick[ev] = i;
  return arr[i];
}

async function askVoice(ev, skill) {
  if (!SAMPLE || !AI.on) return null;
  const prompt = PROMPT_TEMPLATE.replace("{situation}", SITUATION[ev].replace("{skill}", skill || "математика"));
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 12000);
  try {
    const res = await SAMPLE(prompt, { modelTier: "quick", cache: false, signal: ctl.signal });
    return cleanVoice(res && res.text);
  } catch (e) {
    if (e && e.code === "not_granted") { AI.on = false; AI.denied = true; }
    return null;
  } finally {
    clearTimeout(timer);
  }
}

function say(ev, skill) {
  if (VOICE.active) return;   // в режиме живого голоса говорит Листик из голосовой связи
  const id = ++voiceSeq;
  const canned = pickCanned(ev);
  const useAI = !!(SAMPLE && AI.on);
  S.voice = { id, text: useAI ? "" : canned, loading: useAI };
  if (!useAI) { speak(canned); return; }
  setTimeout(() => {
    if (S.voice && S.voice.id === id && S.voice.loading) {
      S.voice = { id, text: canned, loading: false };
      paintVoice();
      speak(canned);
    }
  }, 6000);
  askVoice(ev, skill).then(v => {
    if (!S.voice || S.voice.id !== id || !S.voice.loading) return;
    S.voice = { id, text: v || canned, loading: false };
    paintVoice();
    speak(S.voice.text);
  });
}

/* ---------- озвучка (встроенный голос браузера) ---------- */
const TTS = { on: true, ok: !!(window.speechSynthesis && window.SpeechSynthesisUtterance), voice: null };
function pickRuVoice() {
  if (!TTS.ok) return;
  try { TTS.voice = speechSynthesis.getVoices().find(v => /^ru/i.test(v.lang)) || null; } catch (e) {}
}
if (TTS.ok) {
  pickRuVoice();
  try { speechSynthesis.addEventListener("voiceschanged", () => { pickRuVoice(); if (S && S.view === "home") render(); }); } catch (e) {}
}
function spokenMath(s) {
  return String(s)
    .replace(/<[^>]*>/g, " ")
    .replace(/\(/g, " в скобках ").replace(/\)/g, " ")
    .replace(/\s:\s/g, " разделить на ")
    .replace(/·/g, " умножить на ")
    .replace(/−/g, " минус ")
    .replace(/\+/g, " плюс ")
    .replace(/=/g, " равно ")
    .replace(/\bx\b/gi, " икс ")
    .replace(/ост\./g, "остаток")
    .replace(/\s+/g, " ").trim();
}
function stopSpeech() { if (TTS.ok) { try { speechSynthesis.cancel(); } catch (e) {} } }
function speak(text, force) {
  if (VOICE.active || (VOICE.available && !VOICE.err)) return;   // говорит живой Листик, а не голос браузера
  if (!TTS.ok || (!TTS.on && !force) || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ru-RU";
    if (TTS.voice) u.voice = TTS.voice;
    u.rate = 0.95; u.pitch = 1.1;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function ttsNote() {
  if (!TTS.ok) return "<p>Озвучка в этом браузере не поддерживается, Листик только пишет.</p>";
  if (!TTS.voice) return "<p>На этом устройстве не найден русский голос. Установите его в настройках речи телефона или компьютера (на Android это «Синтез речи Google», на iPhone «Универсальный доступ → Устный контент»).</p>";
  return "<p>Листик читает свои слова вслух голосом устройства. Он звучит как робот, зато работает без интернета. Кнопка 🔊 у вопроса читает вопрос.</p>";
}

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function voiceHTML() {
  const v = S.voice;
  let h = "";
  if (v) h += '<div class="voice">' + LEAF + '<div class="bubble">' +
    (v.loading ? '<span class="dots3" role="img" aria-label="Листик думает"><i></i><i></i><i></i></span>' : esc(v.text)) +
    '</div></div>';
  return h + voiceStatusHTML();
}
function paintVoice() {
  const slot = document.getElementById("voiceslot");
  if (slot) slot.innerHTML = voiceHTML();
}

/* ------------------------------------------------------------ */
const app = document.getElementById("app");
const LEAF = '<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#E5F3E9"/><path d="M8 24C8 14 14 8 24 8c0 10-6 16-16 16z" fill="#1F7A45"/><path d="M8 24l9-9" stroke="#E5F3E9" stroke-width="2" stroke-linecap="round"/></svg>';
const LOGO = '<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#1F7A45"/><path d="M8 24C8 14 14 8 24 8c0 10-6 16-16 16z" fill="#fff"/><path d="M8 24l9-9" stroke="#1F7A45" stroke-width="2" stroke-linecap="round"/></svg>';
const BRAND = '<a class="brand" href="/">' + LOGO + '<span>Листик</span></a>';
const ARROW_R = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F7A45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>';
const ARROW_L = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E2A22" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>';
const SND_ON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E2A22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9a4 4 0 010 6"/><path d="M19 6.5a8 8 0 010 11"/></svg>';
const SND_OFF = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E2A22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l4 5"/><path d="M21 9.5l-4 5"/></svg>';
const LETTERS = ["А", "Б", "В", "Г", "Д"];

let S = { view: "home" };

/* Выбор из мастера (start.html): ?lang=ru&subject=math&grade=3&section=equations.
   Если раздел выбран, задачи идут по очереди, одна за другой. */
const PARAMS = new URLSearchParams(location.search);
if (PARAMS.get("lang") === "kk") document.documentElement.lang = "kk";
let QUEUE = null;   // номера задач выбранного раздела по порядку
let QPOS = -1;      // место текущей задачи в очереди
function buildQueue() {
  const sec = PARAMS.get("section");
  if (!sec) return;
  const q = [];
  TASKS.forEach((t, i) => { if (t.section === sec) q.push(i); });
  QUEUE = q.length ? q : null;
}

function freshEntry(st) { return st.type === "pair" ? st.fields.map(() => "") : [""]; }

function startTask(i) {
  QPOS = QUEUE ? QUEUE.indexOf(i) : -1;
  const st0 = TASKS[i].steps[0];
  S = {
    view: "task", t: i, s: 0, attempts: 0, stage: "ask",
    wrong: [], errors: {}, helped: {}, notes: [],
    entry: freshEntry(st0), active: 0,
    adultOpen: false, adultPassed: false, adultErr: false, emptyMsg: false, voice: null,
    rule: null, similar: null, okText: "", netMsg: "", adultAnswer: null, busy: false
  };
  const LS = TASKS[i].lesson;
  if (LS && LS.cards && LS.cards.length) { S.stage = "lesson"; S.lc = 0; }
  say("start");
  render();
  VOICE.announce();
  call("/api/start", { task: TASKS[i].id });
}

function sndBtn() {
  if (VOICE.available && !VOICE.err) return '';   // говорит живой Листик: переключатель голоса браузера не нужен
  return TTS.ok ? '<button class="snd" data-action="ttstoggle" aria-pressed="' + TTS.on + '">' + (TTS.on ? SND_ON + 'Звук включён' : SND_OFF + 'Звук выключен') + '</button>' : '';
}
function backHTML() { return '<button class="back" data-action="home">' + ARROW_L + 'Все номера</button>'; }
function header(backBtn) {
  return '<div class="top">' + BRAND + '<div class="tools">' + sndBtn() +
    (backBtn ? backHTML()
             : (S.view === "home" ? (USER ? '<button class="back" data-action="cab-open">Кабинет родителя</button>'
                                          : '<button class="back" data-action="auth" data-mode="login">Войти в кабинет</button>') : '')) +
    '</div></div>';
}
function lessonHeader(T, n, done) {
  let pills = "";
  for (let i = 0; i < n; i++) {
    const cls = done || i < S.s || (i === S.s && S.stage === "right") ? "done" : (i === S.s ? "cur" : "");
    pills += '<span class="' + cls + '"></span>';
  }
  const cur = done ? n : S.s + 1;
  return '<div class="top lhead">' + backHTML() + '<div class="lprog">' + voiceBtn() + sndBtn() + '<span class="lno hand">№ ' + T.no + '</span>' +
    '<div class="pills" role="img" aria-label="Шаг ' + cur + ' из ' + n + '">' + pills + '</div><span class="lstep">Шаг ' + cur + ' из ' + n + '</span></div></div>';
}
function notebookAside(T, done) {
  let h = '<aside class="nbcol" aria-label="Тетрадь"><div class="nbno hand">№ ' + T.no +
    (QPOS >= 0 ? ' · ' + (QPOS + 1) + ' из ' + QUEUE.length : '') + (done ? ' · решена' : '') + '</div>';
  h += '<div class="nb' + (T.long ? ' long' : '') + '"><div class="ln cond">' + T.condition + '</div>';
  S.notes.forEach(x => { h += '<div class="ln">' + x + '</div>'; });
  h += '</div><p class="nbcap">Тетрадь ведёт ребёнок: запись появляется после каждого верного шага.</p></aside>';
  return h;
}

function render() {
  const lesson = S.view === "task" || S.view === "done";
  app.classList.toggle("wide", lesson);
  document.body.classList.toggle("plain", lesson);
  if (S.view === "home") return renderHome();
  if (S.view === "auth") return renderAuth();
  if (S.view === "pin") return renderPin();
  if (S.view === "pinreset") return renderPinReset();
  if (S.view === "cabinet") return renderCabinet();
  if (S.view === "done") return renderDone();
  return renderTask();
}

function aiNote() {
  if (SAMPLE_STATE === "pending") return "";
  if (SAMPLE_STATE === "none") return "";
  if (AI.denied) return "<p>Разрешение на голос ИИ не дано. Листик подбадривает заготовленными фразами.</p>";
  if (AI.on) return '<p>Голос Листика работает на ИИ Claude. ИИ только подбадривает и не видит ни вопросов, ни ответов: всё проверяет программа. При первом ответе Claude попросит у взрослого разрешение, расход идёт с аккаунта взрослого.</p><button class="btn ghost small" data-action="aitoggle">Выключить голос ИИ</button>';
  return '<p>Голос ИИ выключен. Листик подбадривает заготовленными фразами.</p><button class="btn ghost small" data-action="aitoggle">Включить голос ИИ</button>';
}

/* ---------- кабинет родителя ---------- */
const val = id => { const el = document.getElementById(id); return el ? el.value : ""; };
const pinInput = (id, ph) => '<input id="' + id + '" class="inp pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="' + (ph || '····') + '">';
const errBox = m => m ? '<div class="fb bad" role="alert">' + esc(m) + '</div>' : '';

function renderAuth() {
  const reg = S.mode === "register", f = S.form || {};
  const en = reg ? 'register' : 'login';
  let h = header(true);
  h += '<div class="tabs"><button class="btn ghost' + (!reg ? ' on' : '') + '" data-action="auth" data-mode="login">Войти</button>' +
       '<button class="btn ghost' + (reg ? ' on' : '') + '" data-action="auth" data-mode="register">Создать кабинет</button></div>';
  h += '<div class="form">';
  h += '<label>Почта<input id="fEmail" class="inp" type="email" autocomplete="username" autocapitalize="none" value="' + esc(f.email || "") + '" data-enter="' + en + '"></label>';
  h += '<label>Пароль' + (reg ? ' <span class="hint">не короче 8 символов</span>' : '') + '<input id="fPass" class="inp" type="password" autocomplete="' + (reg ? 'new-password' : 'current-password') + '" data-enter="' + en + '"></label>';
  if (reg) {
    h += '<label>Повторите пароль<input id="fPass2" class="inp" type="password" autocomplete="new-password" data-enter="register"></label>';
  }
  h += '<label class="chk"><input type="checkbox" data-action="showpw"><span>Показать пароль</span></label>';
  if (reg) {
    h += '<label>Имя или псевдоним ребёнка <span class="hint">без фамилии, школы и адреса</span><input id="fChild" class="inp" maxlength="30" autocomplete="off" value="' + esc(f.childName || "") + '"></label>';

async function openCabinet(tab, flash) {
  const r = await call("/api/cabinet");
  if (r.status === 200) { S = { view: "cabinet", tab: tab || "progress", cab: r.data, flash: flash || "" }; return render(); }
  if (r.status === 401) { USER = null; S = { view: "auth", mode: "login", err: "Войдите заново." }; return render(); }
  if (r.status === 403) { S = { view: "pin", err: "Введите PIN-код ещё раз." }; return render(); }
  S.err = NET; render();
}

async function call(path, payload) {
  try { return await api(path, payload); } catch (e) { return { status: 0, data: {} }; }
}

const LOCKED = "Слишком много неверных попыток. Подождите 10 минут.";
function need(v, x) { if (!x) { S.err = v; render(); return false; } return true; }

async function doAuth(mode) {
  const email = val("fEmail").trim(), password = val("fPass");
  S.form = { email, childName: val("fChild"), agree: !!(document.getElementById("fAgree") || {}).checked };
  S.err = "";
  let payload = { email, password };
  if (mode === "register") {
    const pin = val("fPin");
    if (!need("Введите имя или псевдоним ребёнка.", S.form.childName.trim())) return;
    if (!need("Пароли не совпали. Проверьте раскладку клавиатуры.", password === val("fPass2"))) return;
    if (!need("PIN-коды не совпали.", pin === val("fPin2"))) return;
    if (!need("Нужно согласие на хранение данных.", S.form.agree)) return;
    payload = { email, password, pin, childName: S.form.childName };
  }
  const r = await call(mode === "register" ? "/api/register" : "/api/login", payload);
  if (r.status === 200) { USER = r.data.user; S = { view: "home", flash: mode === "register" ? "Кабинет создан. Запомните PIN-код: он нужен для подсказок и входа в кабинет." : "" }; return render(); }

}

async function submit(answer, pickedIndex) {
  if (S.busy) return;
  const my = S, T = TASKS[S.t], st = T.steps[S.s], stepNo = S.s;
  S.busy = true; S.netMsg = ""; S.emptyMsg = false;
  let r;
  try { r = await api("/api/check", { task: T.id, step: stepNo, answer }); }
  catch (e) { my.busy = false; my.netMsg = "Нет связи. Попробуй ещё раз."; VOICE.onResult({ kind: "error", msg: "нет связи с сервером" }); return S === my && render(); }
  my.busy = false;
  if (S !== my || my.s !== stepNo) { VOICE.onResult({ kind: "error", msg: "шаг уже сменился" }); return; }
  if (r.status === 429) { my.netMsg = "Слишком много попыток. Подожди минуту."; VOICE.onResult({ kind: "error", msg: "слишком много попыток, нужно подождать минуту" }); return render(); }
  if (r.status !== 200 && r.status !== 423) { my.netMsg = "Что-то пошло не так. Обнови страницу."; VOICE.onResult({ kind: "error", msg: "ошибка сервера" }); return render(); }
  const d = r.data;
  if (d.correct) {
    S.stage = "right"; S.okText = d.ok || "";
    if (d.note) S.notes.push(d.note);
    say((S.errors[S.s] || 0) > 0 ? "rightAfter" : "right", st.skill);
    VOICE.onResult({ kind: "correct", ok: d.ok, note: d.note });
  } else if (r.status === 423) {
    S.stage = "locked"; S.rule = d.rule;
    VOICE.onResult({ kind: "locked", rule: d.rule });
  } else {
    S.errors[S.s] = (S.errors[S.s] || 0) + 1;
    S.attempts = d.attempts; S.rule = d.rule; S.similar = d.similar || null;
    if (pickedIndex !== undefined) S.wrong.push(pickedIndex);
    S.entry = freshEntry(st); S.active = 0;
    if (d.locked) { S.stage = "locked"; say("locked", st.skill); }
    else say(S.attempts === 1 ? "wrong1" : "wrong2", st.skill);
    VOICE.onResult({ kind: "wrong", attempts: d.attempts, rule: d.rule, similar: d.similar || null, locked: !!d.locked });
  }
  render();
}

function openAdult() { S.adultOpen = true; S.netMsg = ""; S.adultErr = false; render(); }

async function unlock(value) {
  if (S.busy) return;
  const my = S, T = TASKS[S.t];
  S.busy = true; S.netMsg = "";
  let r;
  try { r = await api("/api/unlock", { task: T.id, step: S.s, pin: value }); }
  catch (e) { my.busy = false; my.netMsg = "Нет связи."; return S === my && render(); }
  my.busy = false;
  if (S !== my) return;
  if (r.status === 403) { USER = null; my.netMsg = "Вход в кабинет закончился. Вернитесь на главную и войдите заново."; }
  else if (r.status === 429) my.adultErr = "limit";
  else if (r.data && r.data.ok) { my.adultPassed = true; my.helped[my.s] = true; my.adultErr = false; my.adultAnswer = r.data.answer_text || null; }
  else my.adultErr = true;
  render();
}

function digit(d) {
  if (S.entry[S.active].length >= 3) return;
  S.entry[S.active] = S.entry[S.active] === "0" ? d : S.entry[S.active] + d;
  S.emptyMsg = false;
  render();
}
function backspace() {
  S.entry[S.active] = S.entry[S.active].slice(0, -1);
  render();
}

function checkTyped() {
  const st = TASKS[S.t].steps[S.s];
  const vals = S.entry.map(v => v === "" ? NaN : parseInt(v, 10));
  if (vals.every(isNaN)) { S.emptyMsg = true; return render(); }
  const missing = vals.findIndex(isNaN);
  if (missing !== -1) { S.active = missing; S.emptyMsg = false; return render(); }
  submit(st.type === "number" ? vals[0] : vals);
}

function nextStep() {
  const T = TASKS[S.t];
  if (S.s === T.steps.length - 1) {
    S.view = "done"; S.voice = null;
    render();
    say("done");
    paintVoice();
    VOICE.announce();
    return;
  }
  stopSpeech();
  S.s++; S.attempts = 0; S.stage = "ask"; S.wrong = []; S.voice = null;
  S.entry = freshEntry(T.steps[S.s]); S.active = 0;
  S.adultOpen = false; S.adultPassed = false; S.adultErr = false; S.emptyMsg = false;
  S.rule = null; S.similar = null; S.okText = ""; S.netMsg = ""; S.adultAnswer = null;
  render();
  VOICE.announce();
}

function renderDone() {
  const T = TASKS[S.t];
  const clean = new Set(), hard = new Set(), repeat = new Set();
  let firstTry = 0;
  T.steps.forEach((st, i) => {
    const e = S.errors[i] || 0;
    if (e === 0 && !S.helped[i]) { firstTry++; clean.add(st.skill); }
    if (e > 0) hard.add(st.skill);
    if (e >= 2 || S.helped[i]) repeat.add(st.skill);
  });
  hard.forEach(x => clean.delete(x));
  const list = s => Array.from(s).join(", ");
  let h = lessonHeader(T, T.steps.length, true);
  h += '<div class="lesson"><section class="lcol">';
  h += '<div id="voiceslot">' + voiceHTML() + '</div>';
  h += '<div class="sum"><h2>Итог занятия</h2>';
  h += '<p>С первого раза получилось шагов: <b>' + firstTry + ' из ' + T.steps.length + '</b>.</p>';
  h += '<p><b>Получилось сам:</b> ' + (clean.size ? list(clean) : 'в этот раз всё давалось с трудом, и это нормально') + '.</p>';
  h += '<p><b>Было трудно:</b> ' + (hard.size ? list(hard) : 'ничего, шаги шли гладко') + '.</p>';
  h += '<p><b>Стоит повторить:</b> ' + (repeat.size ? list(repeat) : 'пока ничего, можно брать следующую задачу') + '.</p>';
  h += '<div class="row">' +
    (QPOS >= 0 && QPOS < QUEUE.length - 1
      ? '<button class="btn" data-action="start" data-i="' + QUEUE[QPOS + 1] + '">Следующая задача</button>'
      : (QPOS >= 0 ? '<a class="btn" href="start.html" style="text-decoration:none;display:inline-flex;align-items:center">Раздел пройден. Выбрать другой</a>' : '<button class="btn" data-action="home">К списку задач</button>')) +
    (QPOS >= 0 ? '<button class="btn ghost" data-action="home">К списку задач</button>' : '') +
    '<button class="btn ghost" data-action="start" data-i="' + S.t + '">Решить ещё раз</button></div></div></section>' + notebookAside(T, true) + '</div>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
}

function readNum(id) {
  const el = document.getElementById(id);
  if (!el) return NaN;
  const v = el.value.replace(/\s+/g, "");
  return /^\d+$/.test(v) ? parseInt(v, 10) : NaN;
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-action]");
  if (!b) return;
  const a = b.dataset.action;
  if (a === "start") return startTask(+b.dataset.i);
  if (a === "home") { stopSpeech(); VOICE.stop(null, true); if (S.view === "cabinet" && USER) call("/api/parent/leave", {}); S = { view: "home" }; return render(); }
  if (a === "auth") { S = { view: "auth", mode: b.dataset.mode || "login", err: "", form: S.form }; return render(); }
  if (a === "showpw") { ["fPass", "fPass2"].forEach(id => { const el = document.getElementById(id); if (el) el.type = b.checked ? "text" : "password"; }); return; }
  if (a === "cab-tab") { S.tab = b.dataset.tab; S.err = ""; return render(); }
  if (a === "login") return doAuth("login");
  if (a === "register") return doAuth("register");
  if (a === "cab-open") { if (!USER) { S = { view: "auth", mode: "login", err: "" }; return render(); } S = { view: "pin" }; return render(); }
  if (a === "pin-enter") return doPinEnter();
  if (a === "pin-forgot") { S = { view: "pinreset" }; return render(); }
  if (a === "pin-reset") return doPinChange(false);
  if (a === "cab-pin") return doPinChange(true);
  if (a === "cab-child") return doChild();
  if (a === "logout") { call("/api/logout", {}); USER = null; S = { view: "home", flash: "Вы вышли из кабинета." }; return render(); }
  if (a === "ttstoggle") { TTS.on = !TTS.on; if (!TTS.on) stopSpeech(); return render(); }
  if (a === "voicetoggle") { if (VOICE.active || VOICE.connecting) VOICE.stop(); else VOICE.start(); return; }
  if (a === "readq") { if (!VOICE.active && VOICE.available && !VOICE.err) { VOICE.start(); return; } if (VOICE.active) return VOICE.tell("[Программа] Ребёнок просит повторить вопрос. Прочитай текущий вопрос ещё раз вслух."); const q = TASKS[S.t].steps[S.s].q; return speak(spokenMath(q), true); }
  if (a === "aitoggle") { AI.on = !AI.on; return render(); }
  if (a === "pick") { const i = +b.dataset.i; return submit(i, i); }
  if (a === "digit") return digit(b.dataset.d);
  if (a === "back") return backspace();
  if (a === "focus") { S.active = +b.dataset.i; return render(); }
  if (a === "check") return checkTyped();
  if (a === "lnext" || a === "lprev") { stopSpeech(); S.lc += a === "lnext" ? 1 : -1; render(); VOICE.announce(true); return; }
  if (a === "lstart") { stopSpeech(); S.stage = "ask"; S.lc = 0; render(); VOICE.announce(); return; }
  if (a === "readlesson") {
    const cards = TASKS[S.t].lesson.cards;
    if (!VOICE.active && VOICE.available && !VOICE.err) { VOICE.start(); return; }
    if (VOICE.active) return VOICE.tell("[Программа] Ребёнок просит прочитать урок ещё раз. Прочитай весь урок вслух дословно, подряд, без пауз и вопросов: " + cards.map(c => vsay(c.text)).join(" "));
    return speak(spokenMath(cards.map(c => plain(c.text)).join(" ")), true);
  }
  if (a === "next") return nextStep();
  if (a === "adult") return openAdult();
  if (a === "adultcheck") {
    return unlock(val("adultIn").trim());
  }
  if (a === "retry") {
    const st = TASKS[S.t].steps[S.s];
    S.stage = "ask"; S.attempts = 2; S.wrong = []; S.adultOpen = false; S.adultPassed = false;
    S.entry = freshEntry(st); S.active = 0; S.netMsg = "";
    say("retry", st.skill);
    render();
    VOICE.announce(true);
    return;
  }
});

/* цифры с обычной клавиатуры (на компьютере) */
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target && e.target.dataset && (e.target.dataset.enter || e.target.id === "adultIn")) {
    const btn = app.querySelector('[data-action="' + (e.target.dataset.enter || "adultcheck") + '"]'); if (btn) btn.click(); return;
  }
  if (!S || S.view !== "task" || S.stage !== "ask") return;
  const st = TASKS[S.t].steps[S.s];
  if (st.type === "choice") return;
  if (e.target && e.target.tagName === "INPUT") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^\d$/.test(e.key)) { digit(e.key); e.preventDefault(); }
  else if (e.key === "Backspace") { backspace(); e.preventDefault(); }
  else if (e.key === "Enter" && !(e.target && e.target.tagName === "BUTTON")) { checkTyped(); e.preventDefault(); }
  else if (st.type === "pair" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    S.active = (S.active + 1) % st.fields.length; render(); e.preventDefault();
  }
});

/* ============================================================
   ЖИВОЙ ГОЛОС (дешёвая схема: браузер записывает речь ребёнка, сервер распознаёт её,
   текстовая модель отвечает, сервер озвучивает ответ; версия на Realtime: listik.realtime.html).
   Ребёнок говорит, Листик отвечает голосом. Правильность ответа,
   как и раньше, проверяет СЕРВЕР (/api/check): модель правильных
   ответов не знает, она получает от сервера только «верно / неверно»,
   правило и подсказку и пересказывает их ребёнку.
   ============================================================ */
const VOICE = {
  available: false, active: false, connecting: false, err: "",
  sid: null, ac: null, node: null, stream: null, player: null, playing: false, listening: false, vad: null,
  inFlight: false, queue: [], pending: null, adv: "none", advTimer: null, maxTimer: null,
  state: "idle", heard: "", greeted: false
};
const VOICE_MAX_MIN = 25;
const VOICE_SILENCE = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA=";
const VOICE_WORKLET = "class Tap extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true;}}registerProcessor('tap',Tap);";
const VOICE_LABEL = { connecting: "Подключаюсь…", listen: "Слушаю тебя", think: "Листик думает…", speak: "Листик говорит" };
function plain(s) { return String(s == null ? "" : s).replace(/<[^>]*>/g, " ").replace(/&nbsp;/g, " ").replace(/\s+/g, " ").trim(); }

/* Знаки -> слова для озвучки: «7 · 4» читается как «7 умножить на 4» (модель сама знаки пропускает) */
// voiceMath:start
function voiceMath(s) {
  return String(s)
    .replace(/(?<=[\d)□])\s:\s(?=[\d(□])/g, " разделить на ")
    .replace(/(?<=[\d)□])\s*[−–]\s*(?=[\d(□])/g, " минус ")
    .replace(/(?<=[\d)□]) - (?=[\d(□])/g, " минус ")
    .replace(/\s*[·×*]\s*/g, " умножить на ")
    .replace(/\s*\+\s*/g, " плюс ")
    .replace(/\s*=\s*/g, " равно ")
    .replace(/\s*>\s*/g, " больше ").replace(/\s*<\s*/g, " меньше ")
    .replace(/\(/g, " открываем скобку ").replace(/\)/g, " закрываем скобку ")
    .replace(/□/g, " окошко ")
    .replace(/(?<=\s)\?(?=\s|$)/g, "какое-то число")
    .replace(/\bx\b/gi, " икс ")
    .replace(/ост\./g, "остаток")
    .replace(/\s+/g, " ").trim();
}
// voiceMath:end
function vsay(s) { return voiceMath(plain(s)); }

function voiceBtn() {
  if (!VOICE.available) return "";
  const on = VOICE.active || VOICE.connecting;
  return '<button class="snd" data-action="voicetoggle" aria-pressed="' + on + '">' + (on ? '🎤 Выключить голос' : '🎤 Включить голос') + '</button>';
}
function voiceStatusHTML() {
  let h = "";
  if (VOICE.err) h += '<div class="vpill bad" role="alert">' + esc(VOICE.err) + '</div>';
  if (VOICE.active || VOICE.connecting) {
    const label = VOICE_LABEL[VOICE.connecting ? "connecting" : VOICE.state] || "";
    h += '<div class="vpill ' + VOICE.state + '" role="status"><span class="vdot"></span>' + label +
      (VOICE.heard ? ' · Я услышал: «' + esc(VOICE.heard) + '»' : '') + '</div>';
  } else if (VOICE.available && S && (S.view === "task" || S.view === "done")) {
    h += '<div class="vstart"><button class="btn" data-action="voicetoggle">🎤 Включить голос Листика</button>' +
      '<span>Листик прочитает вопрос вслух и будет слушать твой ответ.</span></div>';
  }
  return h;
}

Object.assign(VOICE, {
  setState(state, heard) {
    if (state) this.state = state;
    if (heard !== undefined) this.heard = heard;
    paintVoice();
  },

  async start() {
    if (this.active || this.connecting) return;
    this.connecting = true; this.err = ""; this.state = "think"; this.heard = "";
    stopSpeech(); render();
    try {
      // проигрыватель «разблокируется» нажатием кнопки (иначе Safari и телефоны не дадут играть звук)
      this.player = new Audio(VOICE_SILENCE);
      this.player.play().catch(() => {});
      await this.openMic();
      const r = await api("/api/voice/session", {});
      if (r.status === 429) throw new Error("Слишком много запусков голоса. Подожди немного.");
      if (r.status !== 200 || !r.data.sid) throw new Error("Голос сейчас недоступен. Можно отвечать кнопками.");
      this.sid = r.data.sid;
      this.active = true; this.connecting = false; this.state = "think";
      this.maxTimer = setTimeout(() => VOICE.stop("Голос выключился через " + VOICE_MAX_MIN + " минут. Нажми кнопку, чтобы продолжить."), VOICE_MAX_MIN * 60000);
      this.announce(); render();
    } catch (e) {
      const msg = e && e.name === "NotAllowedError" ? "Не получилось включить микрофон. Разреши доступ к нему в настройках браузера."
        : (e && e.message) || "Не получилось включить голос.";
      this.teardown(); this.err = msg; render();
    }
  },

  /* микрофон: звук кусочками, по паузе определяем, что ребёнок договорил */
  async openMic() {
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ac = new AC(); await this.ac.resume();
    await this.ac.audioWorklet.addModule(URL.createObjectURL(new Blob([VOICE_WORKLET], { type: "application/javascript" })));
    const src = this.ac.createMediaStreamSource(this.stream);
    this.node = new AudioWorkletNode(this.ac, "tap");
    this.node.port.onmessage = e => this.onChunk(e.data);
    const mute = this.ac.createGain(); mute.gain.value = 0;
    src.connect(this.node); this.node.connect(mute); mute.connect(this.ac.destination);
    this.vad = { thr: 0.02, calibMs: 0, calibSum: 0, calibN: 0, calibDone: false };
    this.resetVad();
  },
  resetVad() { Object.assign(this.vad, { pre: [], preSamples: 0, speaking: false, voicedMs: 0, silenceMs: 0, buf: [], totalMs: 0 }); },
  armMic() {
    if (!this.active || this.inFlight || this.playing || !this.vad) return;
    this.resetVad(); this.listening = true; this.setState("listen");
  },
  onChunk(f32) {
    const v = this.vad; if (!v || !this.ac) return;
    const sr = this.ac.sampleRate, ms = f32.length / sr * 1000;
    let sum = 0; for (let i = 0; i < f32.length; i++) sum += f32[i] * f32[i];
    const rms = Math.sqrt(sum / f32.length);
    // первые полсекунды слушаем фоновый шум и ставим порог чуть выше него
    if (!v.calibDone) {
      v.calibMs += ms; v.calibSum += rms; v.calibN++;
      if (v.calibMs >= 500) { v.thr = Math.min(0.08, Math.max(0.015, v.calibSum / v.calibN * 3 + 0.005)); v.calibDone = true; }
    }
    if (!this.listening) return;
    if (!v.speaking) {
      v.pre.push(f32); v.preSamples += f32.length;
      while (v.preSamples > sr * 0.3 && v.pre.length > 1) v.preSamples -= v.pre.shift().length;
      if (rms > v.thr) {
        v.voicedMs += ms;
        if (v.voicedMs >= 120) {
          v.speaking = true; v.buf = v.pre.slice(); v.pre = []; v.preSamples = 0; v.silenceMs = 0;
          v.totalMs = v.buf.reduce((a, c) => a + c.length, 0) / sr * 1000;
          this.setState("listen");
        }
      } else v.voicedMs = 0;
    } else {
      v.buf.push(f32); v.totalMs += ms;
      if (rms > v.thr) v.silenceMs = 0; else v.silenceMs += ms;
      // договорил: пауза больше 1,1 секунды или набралось 27 секунд (предел распознавания)
      if (v.silenceMs >= 1100 || v.totalMs >= 27000) {
        const speechMs = v.totalMs - v.silenceMs, chunks = v.buf;
        this.listening = false; this.resetVad();
        if (speechMs < 300) this.armMic(); else this.utterance(chunks);
      }
    }
  },
  utterance(chunks) {
    let total = 0; for (const c of chunks) total += c.length;
    const all = new Float32Array(total); let o = 0;
    for (const c of chunks) { all.set(c, o); o += c.length; }
    const ratio = this.ac.sampleRate / 16000, n = Math.floor(total / ratio), pcm = new Int16Array(n);
    for (let i = 0; i < n; i++) {   // звук -> 16 кГц, 16 бит, моно
      const a = Math.floor(i * ratio), b = Math.max(a + 1, Math.min(total, Math.floor((i + 1) * ratio)));
      let s = 0; for (let j = a; j < b; j++) s += all[j];
      const x = Math.max(-1, Math.min(1, s / (b - a)));
      pcm[i] = x < 0 ? x * 32768 : x * 32767;
    }
    const u8 = new Uint8Array(pcm.buffer); let bin = "";
    for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    this.exchange({ audio: btoa(bin) });
  },

  teardown() {
    try { this.node && this.node.disconnect(); } catch (e) {}
    try { this.stream && this.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
    try { this.ac && this.ac.close(); } catch (e) {}
    try { this.player && this.player.pause(); } catch (e) {}
    clearTimeout(this.advTimer); clearTimeout(this.maxTimer);
    this.sid = this.ac = this.node = this.stream = this.player = this.vad = null;
    this.active = false; this.connecting = false; this.inFlight = false; this.playing = false; this.listening = false;
    this.queue = []; this.pending = null; this.adv = "none"; this.state = "idle"; this.heard = ""; this.greeted = false;
  },
  stop(msg, silent) {
    this.teardown(); this.err = msg || "";
    if (!silent) render();
  },

  tell(t) { if (!this.active) return; this.queue.push(t); this.flush(); },
  flush() {
    if (!this.active || this.inFlight || this.playing || !this.queue.length) return;
    this.exchange({ tell: this.queue.splice(0) });
  },

  /* что происходит на экране -> сообщение для Листика */
  announce(retry) {
    if (!this.active) return;
    if (S.view === "task" && S.stage === "lesson") this.tell(this.lessonText(retry));
    else if (S.view === "task" && S.stage === "ask") this.tell(this.stepText(retry));
    else if (S.view === "done") this.tell(this.doneText());
  },
  stepText(retry) {
    const T = TASKS[S.t], st = T.steps[S.s], n = T.steps.length;
    let t = "[Программа] Задача №" + T.no + ". Условие: " + vsay(T.condition) + ". Сейчас шаг " + (S.s + 1) + " из " + n + ". Вопрос (уже подготовлен для чтения вслух): " + vsay(st.q) + ". ";
    if (st.type === "choice") t += "Тип ответа: выбор варианта (передавай букву в поле choice). Варианты: " + st.options.map((o, i) => LETTERS[i] + ") " + vsay(o)).join("; ") + ". ";
    else if (st.type === "pair") t += "Тип ответа: " + st.fields.length + " числа по порядку (поле values): " + st.fields.map(f => vsay(f)).join(", ") + ". ";
    else t += "Тип ответа: одно целое число (поле number). ";
    if (retry) t += "Взрослый помог, ребёнок пробует этот шаг ещё раз. Ободри его и повтори вопрос.";
    else if (!this.greeted) { this.greeted = true; t += "Это начало занятия: коротко поздоровайся (ты Листик), прочитай ребёнку вопрос вслух дословно и жди ответ голосом."; }
    else t += "Прочитай ребёнку вопрос вслух дословно и жди ответ голосом.";
    return t.replace(/([.?!])\./g, "$1");
  },
  lessonText(again) {
    const T = TASKS[S.t], L = T.lesson;
    let t = "[Программа] Мини-урок «" + vsay(L.title) + "». Прочитай ребёнку весь урок вслух дословно, подряд, одним рассказом, без пауз и без вопросов. Текст: " + L.cards.map(c => vsay(c.text)).join(" ") + " ";
    t += "Картинки на экране не описывай, ничего не добавляй от себя и не называй результатов, которых нет в тексте. Когда дочитаешь, скажи только: «Теперь нажми «Решать задачу»», и замолчи. Если ребёнок просит повторить, прочитай ещё раз дословно. ";
    if (!this.greeted) { this.greeted = true; t += "Это начало занятия: сначала коротко поздоровайся (ты Листик)."; }
    return t.replace(/([.?!])\./g, "$1");
  },
  doneText() {
    const T = TASKS[S.t];
    let first = 0; const hard = new Set();
    T.steps.forEach((st, i) => { const e = S.errors[i] || 0; if (e === 0 && !S.helped[i]) first++; if (e > 0) hard.add(plain(st.skill)); });
    return "[Программа] Задача решена. С первого раза получилось " + first + " из " + T.steps.length + ". Было трудно: " + (hard.size ? [...hard].join(", ") : "ничего") +
      ". Подведи итог в 2–3 коротких предложениях: что получилось само, что стоит повторить. Скажи, что можно нажать «Следующая задача» или сделать перерыв.";
  },

  /* один обмен с сервером: отправили, что случилось; получили вызов проверки или реплику */
  async exchange(first) {
    if (!this.active) return;
    this.inFlight = true; this.listening = false; this.setState("think");
    const sid = this.sid;
    let payload = first;
    try {
      for (let hop = 0; hop < 4; hop++) {
        if (this.queue.length) payload = Object.assign({}, payload, { tell: (payload.tell || []).concat(this.queue.splice(0)) });
        const r = await api("/api/voice/turn", Object.assign({ sid }, payload));
        if (!this.active || this.sid !== sid) return;
        if (r.status === 410) { this.stop("Занятие с голосом получилось слишком долгим. Нажми кнопку, чтобы начать заново."); return; }
        if (r.status !== 200) throw new Error("голос: ответ " + r.status + " " + JSON.stringify(r.data));
        const d = r.data;
        if (d.heard) this.setState(null, String(d.heard).trim().slice(0, 120));
        if (d.calls && d.calls.length) {
          const outputs = [];
          for (const c of d.calls) {
            let out;
            try { out = await this.exec(c); } catch (e) { console.error(e); out = { error: "внутренняя ошибка" }; }
            outputs.push({ call_id: c.call_id, output: JSON.stringify(out) });
          }
          if (!this.active || this.sid !== sid) return;
          if (this.adv === "queued") this.adv = "praising";
          payload = { outputs };
          continue;
        }
        if (this.err) { this.err = ""; paintVoice(); }
        this.inFlight = false;
        await this.playReply(d);
        return;
      }
      this.inFlight = false; this.armMic(); this.flush();
    } catch (e) {
      console.error("[голос]", e);
      this.inFlight = false;
      if (!this.active || this.sid !== sid) return;
      this.err = "С голосом что-то пошло не так. Скажи ещё раз или отвечай кнопками.";
      this.adv = "none"; paintVoice();
      this.armMic(); this.flush();
    }
  },
  async playReply(d) {
    if (d.reply && S) { S.voice = { id: ++voiceSeq, text: d.reply, loading: false }; paintVoice(); }
    if (d.audio && this.player) {
      this.playing = true; this.setState("speak");
      await new Promise(resolve => {
        const p = this.player;
        p.onended = resolve; p.onerror = resolve;
        p.src = "data:" + (d.mime || "audio/mpeg") + ";base64," + d.audio;
        p.play().catch(resolve);
      });
      this.playing = false;
      if (!this.active) return;
    }
    this.setState("listen");
    this.maybeAdvance(false);      // похвалу дочитали: переходим к следующему шагу
    this.flush();                  // сообщения программы, пока мы говорили
    this.armMic();
  },

  async exec(c) {
    if (c.name !== "submit_answer") return { error: "неизвестная функция" };
    let args = {};
    try { args = JSON.parse(c.arguments || "{}"); } catch (e) { return { error: "не удалось прочитать ответ" }; }
    if (S.view !== "task" || S.stage !== "ask" || S.busy) return { error: "Сейчас ответ принять нельзя: шаг не ждёт ответа.", stage: S.stage || S.view };
    const st = TASKS[S.t].steps[S.s];
    let answer, picked;
    if (st.type === "number") {
      if (!Number.isInteger(args.number)) return { error: "Для этого шага нужно одно целое число (поле number)." };
      answer = args.number;
    } else if (st.type === "choice") {
      const i = LETTERS.indexOf(String(args.choice || "").trim().toUpperCase());
      if (i < 0 || i >= st.options.length) return { error: "Для этого шага нужна буква варианта (поле choice): " + LETTERS.slice(0, st.options.length).join(", ") };
      answer = i; picked = i;
    } else {
      if (!Array.isArray(args.values) || args.values.length !== st.fields.length || !args.values.every(Number.isInteger))
        return { error: "Для этого шага нужно " + st.fields.length + " целых числа по порядку (поле values): " + st.fields.map(plain).join(", ") };
      answer = args.values;
    }
    return new Promise(resolve => {
      const p = { resolve: v => { clearTimeout(timer); resolve(v); } };
      const timer = setTimeout(() => { if (VOICE.pending === p) { VOICE.pending = null; resolve({ error: "проверка не ответила, попробуй ещё раз" }); } }, 10000);
      VOICE.pending = p;
      submit(answer, picked);
    });
  },

  /* результат проверки от сервера (вызывается из submit) */
  onResult(info) {
    if (!this.active) return;
    let out;
    if (info.kind === "correct") {
      this.adv = "queued";
      out = { result: "correct", message: vsay(info.ok), instruction: "Произнеси message дословно и добавь не больше пяти слов одобрения. Следующий вопрос не задавай: программа сама перейдёт к следующему шагу." };
    } else if (info.kind === "wrong") {
      out = { result: "wrong", attempt: info.attempts, max_attempts: 3, rule: vsay(info.rule), similar: info.similar ? vsay(info.similar) : null, locked: !!info.locked,
        instruction: info.locked
          ? "Скажи «Так бывает у всех. Можно сделать перерыв или позвать взрослого». Ничего не добавляй, ответ не называй."
          : "Скажи «Пока не так», дословно прочитай rule (и similar, если он есть) и попроси попробовать ещё раз. Ничего не добавляй от себя, ответ не называй и за ребёнка не считай." };
    } else if (info.kind === "locked") {
      out = { result: "locked", locked: true, rule: vsay(info.rule), instruction: "Шаг заблокирован. Скажи «Так бывает у всех. Можно сделать перерыв или позвать взрослого». Ответ не называй." };
    } else out = { error: info.msg || "ошибка" };
    if (this.pending) { const p = this.pending; this.pending = null; p.resolve(out); }
    else this.tell("[Программа] Ребёнок ответил на экране (кнопками). Результат проверки: " + JSON.stringify(out));
  },
  maybeAdvance(force) {
    if (this.adv !== "praising") return;
    if (this.inFlight && !force) return;
    this.adv = "none"; clearTimeout(this.advTimer);
    if (S.view === "task" && S.stage === "right") nextStep();
  }
});

/* ---------- связь с сервером ---------- */
const DATA_DIR = "data/public/";
function randomId() {
  const a = new Uint8Array(16); crypto.getRandomValues(a);
  return Array.from(a, x => x.toString(16).padStart(2, "0")).join("");
}
const SESSION = randomId();
async function loadJSON(name) {
  const res = await fetch(DATA_DIR + name, { cache: "no-cache" });
  if (!res.ok) throw new Error(name + ": " + res.status);
  return res.json();
}
async function api(path, payload) {
  const res = payload
    ? await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({ session: SESSION }, payload)) })
    : await fetch(path, { cache: "no-cache" });
  const data = await res.json().catch(() => ({}));
  return { status: res.status, data };
}
async function loadData() {
  const [tasks, phrases, prompts] = await Promise.all([api("/api/tasks"), loadJSON("phrases.json"), loadJSON("prompts.json")]);
  if (tasks.status !== 200) throw new Error("tasks");
  TASKS = tasks.data.tasks;
  CANNED = phrases.canned;
  SITUATION = phrases.situation;
  PROMPT_TEMPLATE = prompts.ai_voice.template;
  BANNED = new RegExp(prompts.ai_voice.banned_pattern, prompts.ai_voice.banned_flags);
  try { const me = await api("/api/me"); USER = me.data.user || null; } catch (e) { USER = null; }
  try { const v = await api("/api/voice/available"); VOICE.available = !!(v.data && v.data.ok) && !!((window.AudioContext || window.webkitAudioContext) && window.AudioWorkletNode && navigator.mediaDevices && navigator.mediaDevices.getUserMedia); } catch (e) { VOICE.available = false; }
}
async function boot() {
  app.innerHTML = '<div class="top"><div class="brand hand">' + LEAF + 'Листик</div></div><p class="lead">Загружаю задачи…</p>';
  try {
    await loadData();
    if (location.hash === "#cabinet") {
      history.replaceState(null, "", location.pathname);
      S = USER ? { view: "pin" } : { view: "auth", mode: "login", err: "" };
      return render();
    }
    buildQueue();
    if (QUEUE) return startTask(QUEUE[0]);
    render();
  } catch (e) {
    app.innerHTML = '<div class="top"><div class="brand hand">' + LEAF + 'Листик</div></div>' +
      '<p class="lead">Не получилось загрузить задачи. Проверьте интернет и обновите страницу. ' +
      'Если вы запускаете программу сами, откройте её через сервер (команда: node server.js).</p>';
  }
}
boot();
</script>
