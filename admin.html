<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Листик: админ-панель</title>
<link rel="stylesheet" href="/site.css">
<style>
:root{--ink:#1B2440;--muted:#5B6584;--line:#E4E1D6;--paper:#FBFAF6;--card:#fff;--green:#1A7F45;--green-d:#15683A;--green-bg:#E5F3E9;--yellow:#FFD84D;--yellow-bg:#FFF6D0;--red:#C03A2B;--red-bg:#FCE9E6;--blue:#2B4BC4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* вход */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:400px;background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:28px 24px;box-shadow:6px 6px 0 var(--ink)}
.login-card h1{margin:0 0 4px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.login-card p{margin:0 0 18px;color:var(--muted)}

/* шапка */
.top{background:var(--card);border-bottom:2px solid var(--ink);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand small{font-size:13px;font-weight:700;background:var(--yellow);padding:1px 8px;border-radius:999px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tab{border:0;background:none;padding:10px 14px;border-radius:10px;font-weight:700;color:var(--muted)}
.tab:hover{background:var(--paper);color:var(--ink)}
.tab[aria-selected=true]{background:var(--ink);color:#fff}

/* элементы */
main{padding:24px 0 64px}
h2{font-size:24px;margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
h3{font-size:18px;margin:0 0 10px;font-weight:800}
.sub{color:var(--muted);margin:0 0 20px}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:700;min-height:44px}
.btn:hover{background:var(--paper)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-d);border-color:var(--green-d)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:default}
input[type=text],input[type=password],input[type=number],input[type=search],input[type=date],select{border:2px solid var(--ink);border-radius:12px;padding:8px 12px;min-height:44px;background:#fff;width:100%}
input.sm{min-height:36px;padding:4px 10px}
label.f{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>.grow{flex:1;min-width:140px}
.err{color:var(--red);font-weight:700;margin:8px 0 0;min-height:1.4em}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin-bottom:20px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi b{display:block;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.kpi span{color:var(--muted);font-size:14px}
.kpi.hl{border-color:var(--ink);background:var(--yellow-bg)}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.list{list-style:none;margin:0;padding:0}
.list li b{white-space:nowrap}
.list li .badge{align-self:flex-start}
.list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.muted{color:var(--muted)}
.empty{color:var(--muted);padding:6px 0}
.badge{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:800;white-space:nowrap}
.b-green{background:var(--green-bg);color:var(--green-d)}
.b-yellow{background:var(--yellow-bg);color:#7A5B00}
.b-red{background:var(--red-bg);color:var(--red)}
.b-gray{background:#EEEDE6;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:#EEEDE6;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:999px}
.bar.warn i{background:#E0A100}
.bar.over i{background:var(--red)}
svg.chart{width:100%;height:auto;display:block}

/* список учеников */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters input[type=search]{max-width:320px}
.filters select{width:auto}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;min-height:36px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.shead,.srow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,.9fr) minmax(0,1.3fr) minmax(0,1.5fr);gap:12px;align-items:center;padding:10px 14px}
.shead{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.srow{width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;margin-bottom:8px}
.srow:hover{border-color:var(--ink)}
.srow .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .nm span{display:block;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell small{display:block;color:var(--muted);font-size:13px}
@media(max-width:820px){
  .shead{display:none}
  .srow{grid-template-columns:1fr 1fr;gap:8px 12px}
  .srow .nm{grid-column:1/-1}
  .tabs{order:3;width:100%;flex:none;overflow-x:auto;flex-wrap:nowrap}
  .tab{white-space:nowrap}
  .srow .cell:last-child{grid-column:1/-1}
  .cell::before{content:attr(data-l);display:block;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase}
}

/* панель ученика */
.shade{position:fixed;inset:0;background:rgba(27,36,64,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--paper);z-index:50;overflow-y:auto;border-left:2px solid var(--ink);padding:0 0 40px}
.dh{position:sticky;top:0;background:var(--card);border-bottom:2px solid var(--ink);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;z-index:2}
.dh .t{flex:1;min-width:0}
.dh .t b{font-size:22px;font-weight:800;display:block;overflow:hidden;text-overflow:ellipsis}
.dh .t .em{color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:block}
.dbody{padding:16px;display:grid;gap:14px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.mini div{background:var(--paper);border-radius:12px;padding:10px 12px}
.mini b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.mini span{font-size:13px;color:var(--muted)}
.lvl-repeat{color:var(--red)}.lvl-train{color:#7A5B00}.lvl-good{color:var(--green-d)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:100;font-weight:700;max-width:90vw}
.toast.bad{background:var(--red)}
.sw{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.sw input{width:24px;height:24px;margin-top:2px;flex:none;accent-color:var(--green)}
.sw b{display:block}
table.log{width:100%;border-collapse:collapse}
table.log td,table.log th{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top;font-size:15px}
table.log th{font-size:13px;color:var(--muted);text-transform:uppercase;border-top:0}
.scroll{overflow-x:auto}
.hb{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.5fr) auto;gap:10px;align-items:center;padding:6px 0}
.hb .hl{line-height:1.25}
.hb .hbar{height:14px;background:#EEEDE6;border-radius:4px;overflow:hidden}
.hb .hbar i{display:block;height:100%;background:var(--c1);border-radius:0 4px 4px 0}
.hb .hv{font-weight:800;white-space:nowrap;font-size:15px;text-align:right}
.hb .hv small{font-weight:600;color:var(--muted)}
@media(max-width:560px){.hb{grid-template-columns:1fr auto}.hb .hbar{grid-column:1/-1;order:3}}
:root{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100}
.rng{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.cc{position:relative}
.cc svg{width:100%;height:auto;display:block;overflow:visible}
.cc .ax{font-size:12px;fill:#5B6584}
.cc .gl{stroke:#E4E1D6;stroke-width:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin:0 0 6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#tip{position:fixed;z-index:90;background:var(--ink);color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;pointer-events:none;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tip b{display:block;margin-bottom:2px}
#tip i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
details.dt{margin-top:10px;font-size:14px}
details.dt summary{cursor:pointer;color:var(--muted);font-weight:700}
details.dt table{width:100%;border-collapse:collapse;margin-top:6px}
details.dt td,details.dt th{text-align:left;padding:4px 8px;border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(27,36,64,.5);overflow-y:auto}
.modal .card{width:100%;max-width:520px;border:2px solid var(--ink)}
.cred{background:var(--green-bg);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:17px}
.cred code{font-weight:800;font-size:18px;user-select:all}

/* вкладка «Нагрузка» */
.kpi.st-ok{border-color:#9AD2AF}.kpi.st-warn{border-color:var(--yellow);background:var(--yellow-bg)}.kpi.st-bad{border-color:var(--red);background:var(--red-bg)}
.kpi em{display:block;font-style:normal;color:var(--muted);font-size:13px;line-height:1.35;margin-top:6px}
.kpi .badge{margin-top:8px}
.verdict{border:2px solid var(--line);border-radius:16px;padding:14px 18px;margin:0 0 18px;font-weight:700}
.verdict.v-ok{background:var(--green-bg);border-color:#9AD2AF}.verdict.v-warn{background:var(--yellow-bg);border-color:var(--yellow)}.verdict.v-bad{background:var(--red-bg);border-color:var(--red)}
.advice li{padding:8px 0;border-top:1px solid var(--line)}.advice li:first-child{border-top:0}
</style>
</head>
<body>

<div id="loading" class="login"><p class="muted">Загрузка…</p></div>

<div id="off" class="login" hidden>
  <div class="login-card">
    <h1>Админ-панель выключена</h1>
    <p>Чтобы включить её, откройте файл <b>.env</b> в папке Листика и добавьте строку:</p>
    <p><code>ADMIN_PASSWORD=ваш_пароль</code></p>
    <p>Пароль не короче 8 символов. Затем перезапустите сервер и обновите эту страницу.</p>
  </div>
</div>

<div id="login" class="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="off">
    <h1>Листик · вход для владельца</h1>
    <p>Введите пароль администратора.</p>
    <label class="f" for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn primary" style="width:100%">Войти</button>
  </form>
</div>

<div id="app" hidden>
  <header class="top"><div class="wrap">
    <div class="brand">Листик <small>админ</small></div>
    <nav class="tabs" role="tablist" aria-label="Разделы">
      <button class="tab" role="tab" data-tab="overview">Обзор</button>
      <button class="tab" role="tab" data-tab="students">Ученики</button>
      <button class="tab" role="tab" data-tab="charts">Графики</button>
      <button class="tab" role="tab" data-tab="load">Нагрузка</button>
      <button class="tab" role="tab" data-tab="settings">Настройки</button>
      <button class="tab" role="tab" data-tab="log">Журнал</button>
    </nav>
    <button class="btn sm" id="logout">Выйти</button>
  </div></header>
  <main><div class="wrap" id="view"></div></main>
</div>

<div id="shade" class="shade" hidden></div>
<aside id="drawer" class="drawer" hidden role="dialog" aria-modal="true" aria-label="Карточка ученика"></aside>
<div id="toast" class="toast" hidden role="status"></div>
<div id="tip" hidden></div>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-label="Создать кабинет"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TZ = "Asia/Almaty";
const S = { tab: "overview", users: [], tasksTotal: 0, overview: null, filter: "all", q: "", sort: "recent", openId: null, detail: null };

/* ---------- сеть ---------- */
async function api(route, body) {
  let r;
  try { r = await fetch("/api/admin/" + route, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) }); }
  catch (e) { toast("Нет связи с сервером.", true); throw e; }
  let data = {}; try { data = await r.json(); } catch (e) {}
  if (r.status === 401 && route !== "login") { show("login"); throw new Error("login"); }
  return { status: r.status, data };
}
function toast(text, bad) {
  const t = $("toast"); t.textContent = text; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3500);
}

/* ---------- форматы ---------- */
const mins = sec => Math.round((sec || 0) / 60);
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString("ru-RU", { day: "numeric", month: "short", year: "numeric", timeZone: TZ }) : "—";
const fmtDT = iso => iso ? new Date(iso).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: TZ }) : "—";
function ago(iso) {
  if (!iso) return "никогда";
  const d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
  return d <= 0 ? "сегодня" : d === 1 ? "вчера" : d + " дн. назад";
}
const lastSeen = u => [u.lastLessonAt, u.lastLoginAt].filter(Boolean).sort().pop() || null;
function planBadge(u) {
  if (u.blocked) return '<span class="badge b-red">Заблокирован</span>';
  if (u.planActive) return '<span class="badge b-green">Платный до ' + esc(fmtDate(u.planUntil)) + '</span>';
  if (u.planUntil) return '<span class="badge b-yellow">Подписка закончилась</span>';
  return '<span class="badge b-gray">Пробный</span>';
}
function bar(used, max) {
  const pct = max > 0 ? Math.min(100, Math.round(used / max * 100)) : 100;
  return '<div class="bar' + (used >= max ? " over" : pct >= 80 ? " warn" : "") + '"><i style="width:' + pct + '%"></i></div>';
}

/* ---------- экраны ---------- */
function show(which) {
  ["loading", "off", "login", "app"].forEach(k => { $(k).hidden = k !== which; });
  if (which === "login") { closeDrawer(); setTimeout(() => $("pw").focus(), 50); }
}
async function boot() {
  const { data } = await api("status");
  if (!data.configured) return show("off");
  if (!data.loggedIn) return show("login");
  enter();
}
async function enter() {
  show("app");
  try { S.tab = sessionStorage.getItem("adm_tab") || "overview"; } catch (e) {}
  await go(S.tab);
}
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault(); $("loginErr").textContent = "";
  const { status, data } = await api("login", { password: $("pw").value });
  if (status === 200) { $("pw").value = ""; enter(); }
  else $("loginErr").textContent = data.message || "Не получилось войти.";
});
$("logout").addEventListener("click", async () => { await api("logout"); show("login"); });
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));

async function go(tab) {
  clearInterval(LOAD.timer);
  S.tab = tab; try { sessionStorage.setItem("adm_tab", tab); } catch (e) {}
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab ? "true" : "false"));
  const v = $("view"); v.innerHTML = '<p class="muted">Загрузка…</p>';
  try {
    if (tab === "overview") { S.overview = (await api("overview")).data; renderOverview(); }
    else if (tab === "students") { const d = (await api("users")).data; S.users = d.users; S.tasksTotal = d.tasksTotal; renderStudents(); }
    else if (tab === "charts") { await loadCharts(); }
    else if (tab === "load") { await loadLoad(); LOAD.timer = setInterval(() => { if (S.tab === "load") loadLoad(true); }, 10000); }
    else if (tab === "settings") { S.overview = (await api("overview")).data; renderSettings(); }
    else if (tab === "log") { renderLog((await api("log")).data.log); }
  } catch (e) { if (e.message !== "login") v.innerHTML = '<p class="err">Не получилось загрузить данные.</p>'; }
}

/* ---------- обзор ---------- */
function bars(values, labels, color) {
  const W = 560, H = 130, n = values.length, gap = 6, bw = (W - gap * (n - 1)) / n, max = Math.max(1, ...values);
  let g = "";
  values.forEach((v, i) => {
    const h = Math.round((H - 34) * v / max), x = i * (bw + gap), y = H - 18 - h;
    g += '<rect x="' + x.toFixed(1) + '" y="' + y + '" width="' + bw.toFixed(1) + '" height="' + Math.max(h, v > 0 ? 2 : 0) + '" rx="3" fill="' + color + '"><title>' + esc(labels[i]) + ': ' + v + '</title></rect>';
    if (v > 0) g += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 4) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#1B2440">' + v + '</text>';
    if (i % 2 === (n - 1) % 2) g += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 3) + '" text-anchor="middle" font-size="10" fill="#5B6584">' + esc(labels[i].slice(8) + "." + labels[i].slice(5, 7)) + '</text>';
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">' + g + '</svg>';
}
function renderOverview() {
  const o = S.overview, t = o.totals, s = o.series;
  const kpi = (n, l, hl) => '<div class="kpi' + (hl ? " hl" : "") + '"><b>' + n + '</b><span>' + l + '</span></div>';
  const ul = (arr, f, empty) => arr.length ? '<ul class="list">' + arr.map(f).join("") + '</ul>' : '<p class="empty">' + empty + '</p>';
  $("view").innerHTML =
    '<h2>Обзор</h2><p class="sub">Сводка по всему Листику на сегодня.</p>' +
    '<div class="grid kpis">' +
      kpi(t.users, "зарегистрировано", true) + kpi(t.new7, "новых за 7 дней") + kpi(t.new30, "новых за 30 дней") +
      kpi(t.activeToday, "занимались сегодня") + kpi(t.active7, "занимались за 7 дней") + kpi(t.paid, "с платной подпиской") +
      kpi(mins(t.studyToday), "мин занятий сегодня") + kpi(mins(t.voiceToday), "мин голоса сегодня") +
      kpi(t.guestsToday, "гостей без кабинета сегодня") + kpi(t.lessons, "пройдено задач всего") + (t.blocked ? kpi(t.blocked, "заблокировано") : "") +
    '</div>' +
    '<div class="grid two">' +
      '<div class="card"><h3>Регистрации по дням</h3>' + bars(s.map(x => x.regs), s.map(x => x.day), "#1A7F45") + '</div>' +
      '<div class="card"><h3>Сколько учеников занималось</h3>' + bars(s.map(x => x.active), s.map(x => x.day), "#2B4BC4") + '</div>' +
      '<div class="card"><h3>Минут занятий по дням</h3>' + bars(s.map(x => x.studyMin), s.map(x => x.day), "#E0A100") + '</div>' +
      '<div class="card"><h3>Подписка заканчивается за 7 дней</h3>' + ul(o.expiring, x =>

function tip(e, html) { const t = $("tip"); if (!html) { t.hidden = true; return; } t.innerHTML = html; t.hidden = false; const w = t.offsetWidth; t.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + "px"; t.style.top = (e.clientY + 14) + "px"; }
function tableOf(head, rows) { return '<details class="dt"><summary>Показать данные таблицей</summary><div class="scroll"><table><thead><tr>' + head.map(h => '<th>' + esc(h) + '</th>').join("") + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join("") + '</tr>').join("") + '</tbody></table></div></details>'; }
let CID = 0;
/* линии и столбики с подсказкой при наведении. kind: "line" | "bar"; series: [{name, values, color}] */
function chart(kind, labels, series, unit, fmt) {
  fmt = fmt || fmtDM;
  const id = "ch" + (++CID), W = 480, H = 220, L = 34, R = 8, T = 12, B = 24, n = labels.length;
  const max = niceMax(Math.max(1, ...series.flatMap(s => s.values))), pw = W - L - R, ph = H - T - B;
  const X = i => L + (kind === "bar" ? (pw / n) * (i + .5) : n === 1 ? pw / 2 : pw * i / (n - 1)), Y = v => T + ph - ph * v / max;
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = max * k / 4, y = Y(v); g += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text class="ax" x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + Math.round(v) + '</text>'; }
  const step = Math.ceil(n / 8);
  labels.forEach((d, i) => { if ((n - 1 - i) % step === 0) g += '<text class="ax" x="' + X(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + fmt(d) + '</text>'; });
  if (kind === "bar") {
    const bw = Math.max(3, Math.min(28, pw / n - 3));
    series[0].values.forEach((v, i) => { const h = Math.max(v > 0 ? 2 : 0, ph * v / max); g += '<path d="M' + (X(i) - bw / 2) + ' ' + (T + ph) + 'V' + (T + ph - h + Math.min(4, h)) + 'q0 -' + Math.min(4, h) + ' ' + Math.min(4, bw / 2) + ' -' + Math.min(4, h) + 'h' + (bw - 2 * Math.min(4, bw / 2)) + 'q' + Math.min(4, bw / 2) + ' 0 ' + Math.min(4, bw / 2) + ' ' + Math.min(4, h) + 'V' + (T + ph) + 'z" fill="' + series[0].color + '"/>'; });
  } else {
    series.forEach(s => {
      g += '<polyline fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="' + s.values.map((v, i) => X(i).toFixed(1) + "," + Y(v).toFixed(1)).join(" ") + '"/>';
      const last = s.values.length - 1; g += '<circle cx="' + X(last) + '" cy="' + Y(s.values[last]) + '" r="4" fill="' + s.color + '" stroke="#fff" stroke-width="2"/>';
    });

  const html = (series.length > 1 ? '<div class="legend">' + series.map(s => '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>').join("") + '</div>' : "") +
    '<div class="cc"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(series.map(s => s.name).join(", ")) + '">' + g + '</svg></div>' +
    tableOf(["Дата"].concat(series.map(s => s.name)), labels.map((d, i) => [fmt(d)].concat(series.map(s => s.values[i]))));
  setTimeout(() => {
    const hit = $(id + "h"); if (!hit) return; const svg = hit.ownerSVGElement, cx = $(id + "x");
    hit.addEventListener("mousemove", e => {
      const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
      let i = kind === "bar" ? Math.floor((px - L) / (pw / n)) : Math.round((px - L) / pw * (n - 1)); i = Math.max(0, Math.min(n - 1, i));

      tip(e, '<b>' + fmt(labels[i]) + '</b>' + series.map(s => (series.length > 1 || kind === "line" ? '<i style="background:' + s.color + '"></i>' : "") + esc(s.name) + ': ' + s.values[i] + (unit ? " " + unit : "")).join("<br>"));
    });

  }, 0);

}

    }).join("");

function exportCsv() {
  const head = ["Почта", "Ребёнок", "Регистрация", "Последний вход", "Последнее занятие", "Задач решено", "Задач всего", "С 1-й попытки %", "Минут за 7 дней", "Подписка до", "Заблокирован"];
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const rows = filtered().map(u => [u.email, u.child, u.createdAt || "", u.lastLoginAt || "", u.lastLessonAt || "", u.tasksDone, u.tasksTotal, u.firstTryPct == null ? "" : u.firstTryPct, mins(u.weekStudy), u.planActive ? u.planUntil.slice(0, 10) : "", u.blocked ? "да" : ""]);
  const csv = "﻿" + [head].concat(rows).map(r => r.map(q).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "listik-ucheniki.csv"; document.body.appendChild(a); a.click(); a.remove();
}

async function doAct(body, okText) {
  const id = S.openId; if (!id) return;
  const { status, data } = await api("action", Object.assign({ id }, body));
  if (status !== 200) return toast(data.message || "Не получилось.", true);
  toast(okText);
  if (!data.user) { S.users = S.users.filter(x => x.id !== id); closeDrawer(); if (S.tab === "students") drawList(); return; }
  S.detail = data.user; const i = S.users.findIndex(x => x.id === id);
  if (i >= 0) S.users[i] = Object.assign({}, S.users[i], data.user);
  renderDrawer(); if (S.tab === "students") drawList();
  if (S.overview) api("overview").then(r => { S.overview = r.data; });
}

function closeModal() { $("modal").hidden = true; $("modal").innerHTML = ""; }

    '<label class="f" for="mke">Почта родителя</label><input id="mke" type="text" inputmode="email" required>' +

    '<label class="f" for="mkd" style="margin-top:10px">Тариф</label><select id="mkd"><option value="0">Пробный (без подписки)</option><option value="30">Платный на 30 дней</option><option value="90">Платный на 3 месяца</option><option value="365">Платный на 12 месяцев</option></select>' +
    '<p class="err" id="mkErr" role="alert"></p>' +
    '<div class="act"><button class="btn primary" type="submit">Создать кабинет</button><button class="btn" type="button" id="mkCancel">Отмена</button></div></form>';
  $("mkCancel").addEventListener("click", closeModal);

    m.innerHTML = '<div class="card"><h3>Кабинет создан</h3><p style="margin:0">Передайте эти данные родителю. Пароль и PIN показаны только сейчас, потом их не посмотреть (но можно задать новые в карточке ученика).</p>' +
      '<div class="cred">Почта: <code>' + esc(data.email) + '</code><br>Пароль: <code>' + esc(data.password) + '</code><br>PIN родителя: <code>' + esc(data.pin) + '</code></div>' +

    $("mkCopy").addEventListener("click", async () => { try { await navigator.clipboard.writeText(text); toast("Скопировано."); } catch (e) { toast("Не получилось скопировать, выделите данные вручную.", true); } });
