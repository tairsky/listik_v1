<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Оплата — Листик</title>
<link rel="icon" type="image/png" href="/img/logo.png">
<style>
@font-face{font-family:"Nunito";src:url("/fonts/Nunito-var-cyrillic.woff2") format("woff2");font-weight:200 1000;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Nunito";src:url("/fonts/Nunito-var-latin.woff2") format("woff2");font-weight:200 1000;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+2000-206F,U+20AC}
body{margin:0;background:#F6FAF4;color:#1E2A22;font-family:Nunito,system-ui,sans-serif;font-size:18px;line-height:1.6}
header{background:#1E2A22;padding:14px 24px}
header a{display:inline-flex;align-items:center;gap:10px;color:#A7D568;font-weight:800;font-size:26px;text-decoration:none}
header img{height:40px;width:auto}
main{max-width:560px;margin:0 auto;padding:40px 20px 64px;text-align:center}
h1{font-size:30px;line-height:1.25;margin:0 0 10px}
p{margin:0 0 14px}
.muted{color:#4B5575;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 28px;border-radius:16px;background:#1F7A45;color:#fff;font-weight:700;font-size:18px;text-decoration:none;border:0;cursor:pointer;margin:6px}
.btn.ghost{background:transparent;color:#1E2A22;border:2px solid #1E2A22}
.icon{font-size:56px;line-height:1;margin-bottom:8px}
</style>
</head>
<body>
<header><a href="/"><img src="/img/logo.png" alt="" width="44" height="40"><b>Листик</b></a></header>
<main id="m" aria-live="polite"><div class="icon">⏳</div><h1>Проверяем оплату…</h1><p class="muted">Это займёт несколько секунд. Страницу не закрывайте.</p></main>
<script>
(function () {
  var T = {"locale": "ru-RU", "noOrder": "Платёж не найден", "toCabinet": "В кабинет", "cabinet": "/listik.html#cabinet", "loginH": "Войдите в кабинет", "loginP": "Чтобы увидеть результат оплаты, войдите в кабинет родителя.", "login": "Войти", "loginHref": "/listik.html#login", "paidH": "Оплата прошла", "paidP": "Подписка действует до %d. Все упражнения открыты.", "cont": "Продолжить", "start": "/listik.html", "failH": "Оплата не прошла", "failP": "Деньги не списаны. Можно попробовать ещё раз.", "again": "Попробовать снова", "payHref": "/listik.html#pay", "slowH": "Ещё проверяем оплату", "slowP": "Если деньги списаны, подписка включится в течение нескольких минут, а на почту придёт письмо. Если этого не случилось, напишите нам на billing@listik.kz или в WhatsApp.", "recheck": "Проверить ещё раз", "wa": "Написать в WhatsApp", "netH": "Нет связи с сервером", "netP": "Проверьте интернет и обновите страницу. Если деньги списаны, подписка включится сама."};
  var m = document.getElementById("m");
  var id = new URLSearchParams(location.search).get("order") || "";
  var tries = 0;
  function show(icon, h, p, btns) {
    m.innerHTML = '<div class="icon">' + icon + '</div><h1></h1><p class="muted"></p><div id="b"></div>';
    m.querySelector("h1").textContent = h; m.querySelector("p").textContent = p;
    var b = document.getElementById("b");
    btns.forEach(function (x) { var a = document.createElement("a"); a.className = "btn" + (x.ghost ? " ghost" : ""); a.href = x.href; a.textContent = x.t; b.appendChild(a); });
  }
  function fmt(iso) { try { return new Date(iso).toLocaleDateString(T.locale, { day: "numeric", month: "long", year: "numeric" }); } catch (e) { return iso.slice(0, 10); } }
  function poll() {
    if (!id) return show("❔", T.noOrder, "", [{ t: T.toCabinet, href: T.cabinet }]);
    fetch("/api/pay/status?order=" + encodeURIComponent(id), { cache: "no-store", credentials: "same-origin" })
      .then(function (r) { return r.status === 401 ? { s: 401 } : r.json().then(function (d) { d.s = r.status; return d; }); })
      .then(function (d) {
        if (d.s === 401) return show("🔑", T.loginH, T.loginP, [{ t: T.login, href: T.loginHref }]);
        if (d.s === 404) return show("❔", T.noOrder, "", [{ t: T.toCabinet, href: T.cabinet }]);
        if (d.status === "paid") return show("✅", T.paidH, T.paidP.replace("%d", fmt(d.until)), [{ t: T.cont, href: d.returnTo || T.start }, { t: T.toCabinet, href: T.cabinet, ghost: true }]);
        if (d.status === "failed") return show("😕", T.failH, T.failP, [{ t: T.again, href: T.payHref }, { t: T.toCabinet, href: T.cabinet, ghost: true }]);
        if (++tries < 20) return setTimeout(poll, 2000);
        show("⏳", T.slowH, T.slowP, [{ t: T.recheck, href: location.href }, { t: T.wa, href: "https://wa.me/77759714163", ghost: true }]);
      })
      .catch(function () { if (++tries < 20) setTimeout(poll, 3000); else show("📶", T.netH, T.netP, [{ t: T.recheck, href: location.href }]); });
  }
  poll();
})();
</script>
</body>
</html>
